<!DOCTYPE html>
<html lang="ar" dir="rtl" id="root" data-theme="midnight">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0F1113">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ميزان">
<title>ميزان — إدارة مالية</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
:root,[data-theme="midnight"]{--bg:#0F1113;--surf:#15181B;--pa:#1C2126;--pb:#171B1F;--inset:#111518;
--line:#272D33;--line2:#1F252A;--text:#F3EFE6;--sub:#8E887A;--dim:#625D53;
--acc:#D6B262;--acc2:#B08F3E;--ink:#14181B;--grn:#74A67F;--red:#D4756C;--amb:#DBA646;
--g1:#192C23;--g2:#241B33}
[data-theme="ocean"]{--bg:#0A1016;--surf:#0F1821;--pa:#15212C;--pb:#111B24;--inset:#0C141B;
--line:#213240;--line2:#1A2731;--text:#EAF2F7;--sub:#7D94A4;--dim:#59707E;
--acc:#51B7C8;--acc2:#2E8EA0;--ink:#06121A;--grn:#5FB490;--red:#D4756C;--amb:#DBA646;--g1:#0D3341;--g2:#142A45}
[data-theme="forest"]{--bg:#0C1210;--surf:#111A15;--pa:#17231C;--pb:#131D18;--inset:#0E1712;
--line:#233326;--line2:#1C2A20;--text:#EEF4EB;--sub:#889880;--dim:#5F6E58;
--acc:#93C46D;--acc2:#6E9E4C;--ink:#0B1409;--grn:#82C492;--red:#D4756C;--amb:#DBA646;--g1:#15351F;--g2:#22301A}
[data-theme="plum"]{--bg:#110C14;--surf:#18121D;--pa:#211928;--pb:#1A1421;--inset:#140E19;
--line:#302439;--line2:#271D2E;--text:#F2EBF5;--sub:#9888A2;--dim:#6E6078;
--acc:#BC8EDB;--acc2:#9565B8;--ink:#120C15;--grn:#74A67F;--red:#DC7189;--amb:#DBA646;--g1:#33194A;--g2:#4A1D38}
[data-theme="graphite"]{--bg:#0D0E0F;--surf:#141617;--pa:#1D2021;--pb:#181A1C;--inset:#121415;
--line:#2A2E30;--line2:#212527;--text:#EEEFF0;--sub:#8B8F92;--dim:#64686B;
--acc:#C6CBCF;--acc2:#9DA3A8;--ink:#141617;--grn:#7AAC8D;--red:#CB7F77;--amb:#DBA646;--g1:#1E2427;--g2:#22262A}
[data-theme="sand"]{--bg:#F4F1EA;--surf:#FCFAF7;--pa:#FFFFFF;--pb:#FBF9F5;--inset:#F2EEE7;
--line:#E3DCCE;--line2:#EBE5DB;--text:#202427;--sub:#7A7363;--dim:#9A937F;
--acc:#A87B2C;--acc2:#8A651D;--ink:#FFFFFF;--grn:#3E7A4F;--red:#B04A42;--amb:#97690F;--g1:#EAE3D3;--g2:#F0E7DD}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{touch-action:manipulation;-webkit-text-size-adjust:100%}
body{background:radial-gradient(1200px 600px at 10% -14%,var(--g1),transparent 60%),
radial-gradient(950px 500px at 115% 0%,var(--g2),transparent 56%),var(--bg);
color:var(--text);font-family:'IBM Plex Sans Arabic',sans-serif;-webkit-font-smoothing:antialiased;
min-height:100vh;line-height:1.6;overflow-x:hidden;overscroll-behavior-y:contain;transition:background .3s}
#app{max-width:640px;margin:0 auto;min-height:100vh;background:var(--surf);display:flex;
flex-direction:column;box-shadow:0 0 60px rgba(0,0,0,.3);position:relative;overflow-x:hidden}

/* header */
header{padding:calc(13px + env(safe-area-inset-top)) 18px 0;border-bottom:1px solid var(--line);
position:sticky;top:0;background:color-mix(in srgb,var(--surf) 88%,transparent);backdrop-filter:blur(18px);z-index:20}
.htop{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:36px;height:36px;border-radius:11px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
background:linear-gradient(145deg,var(--acc),var(--acc2) 130%);
box-shadow:0 4px 14px color-mix(in srgb,var(--acc) 28%,transparent),inset 0 1px 0 rgba(255,255,255,.22)}
.mark svg{width:20px;height:20px}
.bt{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15.5px;letter-spacing:.3px;line-height:1.2}
.bs{font-size:10px;color:var(--sub);display:flex;align-items:center;gap:5px;margin-top:1px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--sub);flex-shrink:0}
.dot.ok{background:var(--grn);box-shadow:0 0 6px var(--grn)}
.dot.cl{background:var(--acc);box-shadow:0 0 6px var(--acc)}
.avbtn{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:var(--inset);
cursor:pointer;overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;padding:0;color:var(--sub)}
.avbtn img{width:100%;height:100%;object-fit:cover;display:block}
.avbtn svg{width:17px;height:17px}
.avbtn.on{border-color:var(--acc)}

.msw{display:inline-flex;align-items:center;gap:1px;background:var(--inset);border:1px solid var(--line);
border-radius:20px;padding:3px 4px;flex-shrink:0;width:fit-content}
.mb{width:27px;height:27px;border-radius:50%;border:none;background:transparent;color:var(--text);
display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .14s}
.mb:active{background:var(--line2)}
.mb svg{width:13px;height:13px}
.ml{font-family:'JetBrains Mono',monospace;font-size:11px;min-width:80px;text-align:center;font-weight:500}
.ptitle{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;padding:13px 0 15px;letter-spacing:.2px}

main{flex:1;overflow-y:auto;overflow-x:hidden;padding:15px 15px 118px}
.sec{display:flex;flex-direction:column;gap:13px;animation:rise .26s cubic-bezier(.2,.7,.3,1)}
@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

.card{background:linear-gradient(168deg,var(--pa),var(--pb));border:1px solid var(--line);
border-radius:17px;padding:16px;box-shadow:0 1px 2px rgba(0,0,0,.14),0 6px 18px rgba(0,0,0,.14)}
.ch{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;margin-bottom:13px;
display:flex;align-items:center;gap:8px;letter-spacing:.2px}
.ch svg{width:15px;height:15px;color:var(--acc);flex-shrink:0}
.ch .sp{margin-inline-start:auto;font-family:'JetBrains Mono',monospace;font-size:11.5px;font-weight:600;color:var(--sub)}

/* hero */
.hero{background:linear-gradient(165deg,var(--pa),var(--pb));border:1px solid var(--line);
border-radius:19px;padding:17px;box-shadow:0 1px 2px rgba(0,0,0,.14),0 8px 24px rgba(0,0,0,.16);
display:flex;align-items:center;gap:16px}
.hmeta{flex:1;min-width:0}
.hlab{font-size:11px;color:var(--sub);font-weight:500}
.hval{font-family:'JetBrains Mono',monospace;font-size:29px;font-weight:700;letter-spacing:-.8px;line-height:1.2;margin:2px 0 11px}
.hval small{font-size:12px;font-weight:400;color:var(--sub);letter-spacing:0}
.hrow{display:flex;gap:8px}
.hcell{flex:1;background:var(--inset);border:1px solid var(--line2);border-radius:11px;padding:8px 10px;min-width:0}
.hcell .l{font-size:9.5px;color:var(--sub);display:flex;align-items:center;gap:4px}
.hcell .l svg{width:11px;height:11px}
.hcell .v{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;margin-top:2px;
overflow:hidden;text-overflow:ellipsis}
.ring{width:84px;height:84px;flex-shrink:0;position:relative}
.ring svg{transform:rotate(-90deg)}
.ringtx{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringtx b{font-family:'JetBrains Mono',monospace;font-size:16px;line-height:1}
.ringtx i{font-size:8.5px;color:var(--sub);font-style:normal;margin-top:2px}

/* insights */
.ins{display:flex;gap:11px;align-items:flex-start;border-radius:13px;padding:12px 13px;
background:var(--inset);border:1px solid var(--line2);border-inline-start:3px solid var(--sub)}
.ins+.ins{margin-top:8px}
.ins .ic{font-size:16px;line-height:1.25;flex-shrink:0}
.ins .t{font-size:12.5px;font-weight:700;line-height:1.5}
.ins .b{font-size:11.5px;color:var(--sub);line-height:1.7;margin-top:2px}
.ins.danger{border-inline-start-color:var(--red)} .ins.danger .t{color:var(--red)}
.ins.warn{border-inline-start-color:var(--amb)} .ins.warn .t{color:var(--amb)}
.ins.good{border-inline-start-color:var(--grn)} .ins.good .t{color:var(--grn)}
.ins.info{border-inline-start-color:var(--acc)}

/* budget bars */
.brow{margin-bottom:13px}.brow:last-child{margin-bottom:0}
.btop{display:flex;justify-content:space-between;align-items:center;gap:9px;margin-bottom:6px;font-size:12.5px}
.bnm{display:flex;align-items:center;gap:7px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bamt{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--sub);white-space:nowrap}
.track{height:6px;border-radius:4px;background:var(--inset);overflow:hidden}
.fill{height:100%;border-radius:4px;transition:width .5s cubic-bezier(.3,.8,.3,1)}

.empty{display:flex;flex-direction:column;align-items:center;gap:9px;padding:28px 14px;
color:var(--dim);font-size:12.5px;text-align:center;line-height:1.8}
.empty svg{width:25px;height:25px;opacity:.45}

/* rows */
.row{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line2)}
.row:last-child{border-bottom:none}
.row.tap{cursor:pointer}
.row.tap:active{opacity:.6}
.rico{width:35px;height:35px;border-radius:11px;display:flex;align-items:center;justify-content:center;
font-size:15px;flex-shrink:0;background:color-mix(in srgb,var(--tone,var(--acc)) 13%,transparent)}
.rmain{flex:1;min-width:0}
.rt{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rs{font-size:11px;color:var(--sub);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ra{font-family:'JetBrains Mono',monospace;font-size:13.5px;font-weight:700;white-space:nowrap}
.ib{width:33px;height:33px;border-radius:10px;border:1px solid var(--line);background:var(--inset);
color:var(--sub);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.ib svg{width:14px;height:14px}
.ib:active{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,transparent)}
.dsep{font-size:11px;color:var(--sub);font-weight:600;padding:13px 0 3px;display:flex;justify-content:space-between}
.dsep b{font-family:'JetBrains Mono',monospace;color:var(--red);font-weight:600}

/* form */
input,select{width:100%;background:var(--inset);border:1px solid var(--line);border-radius:11px;
padding:11px 13px;color:var(--text);font-family:inherit;font-size:16px;outline:none;min-height:46px;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 13%,transparent)}
input::placeholder{color:var(--dim)}
label.fl{font-size:11px;color:var(--sub);font-weight:500;display:block;margin-bottom:5px}
.fld{margin-bottom:10px}
.frow{display:flex;gap:9px}.frow>.fld{flex:1;margin-bottom:0}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:12px;
padding:13px 18px;font-family:inherit;font-weight:700;font-size:14.5px;cursor:pointer;min-height:48px;width:100%;
background:linear-gradient(145deg,var(--acc),var(--acc2));color:var(--ink);
box-shadow:0 4px 14px color-mix(in srgb,var(--acc) 22%,transparent),inset 0 1px 0 rgba(255,255,255,.2);
transition:transform .13s,box-shadow .13s}
.btn svg{width:17px;height:17px}
.btn:active{transform:scale(.982)}
.btn.ghost{background:var(--inset);color:var(--text);border:1px solid var(--line);box-shadow:none}
.btn.danger{background:transparent;color:var(--red);border:1px solid color-mix(in srgb,var(--red) 38%,transparent);box-shadow:none}
.btn.google{background:#fff;color:#1f1f1f;border:1px solid #dadce0;box-shadow:0 2px 8px rgba(0,0,0,.14)}
.btn.google svg{width:18px;height:18px}
.pill{font-family:'JetBrains Mono',monospace;font-size:11.5px;padding:5px 11px;border-radius:20px;font-weight:600;
white-space:nowrap;background:color-mix(in srgb,var(--grn) 13%,transparent);color:var(--grn);
border:1px solid color-mix(in srgb,var(--grn) 24%,transparent)}
.pill.exp{background:color-mix(in srgb,var(--red) 13%,transparent);color:var(--red);
border-color:color-mix(in srgb,var(--red) 24%,transparent)}

/* FAB */
.fab{position:fixed;bottom:calc(76px + env(safe-area-inset-bottom));
inset-inline-end:max(17px,calc(50vw - 320px + 17px));width:56px;height:56px;border-radius:18px;border:none;
z-index:40;cursor:pointer;background:linear-gradient(145deg,var(--acc),var(--acc2));color:var(--ink);
box-shadow:0 7px 24px color-mix(in srgb,var(--acc) 40%,transparent),inset 0 1px 0 rgba(255,255,255,.25);
display:flex;align-items:center;justify-content:center;transition:transform .14s}
.fab svg{width:25px;height:25px}
.fab:active{transform:scale(.92)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(3,5,7,.68);backdrop-filter:blur(3px);z-index:50;opacity:0;transition:opacity .22s}
.scrim.on{opacity:1}
.sheet{position:fixed;inset-inline:0;bottom:0;z-index:51;background:var(--surf);border-radius:22px 22px 0 0;
border-top:1px solid var(--line);max-width:640px;margin:0 auto;max-height:94vh;overflow-y:auto;
padding:9px 16px calc(16px + env(safe-area-inset-bottom));transform:translateY(100%);
transition:transform .27s cubic-bezier(.2,.8,.3,1)}
.sheet.on{transform:translateY(0)}
.grab{width:38px;height:4px;border-radius:3px;background:var(--line);margin:3px auto 11px}
.stitle{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15.5px;margin-bottom:12px;
display:flex;justify-content:space-between;align-items:center}
.xb{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--inset);
color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer}
.xb svg{width:14px;height:14px}

.seg{display:flex;background:var(--inset);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px;margin-bottom:12px}
.seg button{flex:1;border:none;background:transparent;color:var(--sub);border-radius:9px;padding:9px;
font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}
.seg button.on{background:linear-gradient(145deg,var(--acc),var(--acc2));color:var(--ink)}
.seg.ex button.on{background:linear-gradient(145deg,var(--red),color-mix(in srgb,var(--red) 72%,#000));color:#fff}
.seg.in button.on{background:linear-gradient(145deg,var(--grn),color-mix(in srgb,var(--grn) 72%,#000));color:#fff}

.amt{text-align:center;padding:4px 0 11px}
.amt .v{font-family:'JetBrains Mono',monospace;font-size:40px;font-weight:700;letter-spacing:-1px;line-height:1.1;direction:ltr}
.amt .c{font-size:11.5px;color:var(--sub);margin-top:1px}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:3px 0 11px}
.key{border:1px solid var(--line);background:var(--inset);color:var(--text);border-radius:13px;height:50px;
font-family:'JetBrains Mono',monospace;font-size:19px;font-weight:600;cursor:pointer;
display:flex;align-items:center;justify-content:center;transition:transform .1s,background .1s}
.key:active{background:var(--line2);transform:scale(.95)}
.key svg{width:19px;height:19px}

.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:11px}
.chip{border:1px solid var(--line);background:var(--inset);color:var(--text);border-radius:21px;padding:8px 12px;
font-family:inherit;font-size:12.5px;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap;transition:all .14s}
.chip .e{font-size:14px}
.chip.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,var(--inset));font-weight:600}
.chip:active{transform:scale(.95)}
.chip.q{border-style:dashed}
.chip.q b{font-family:'JetBrains Mono',monospace}

.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:9px}
.tchip{border:1.5px solid var(--line);border-radius:13px;padding:10px 7px;cursor:pointer;background:var(--inset);
display:flex;flex-direction:column;align-items:center;gap:7px;font-family:inherit;transition:all .16s}
.tchip.on{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 14%,transparent)}
.sw{display:flex;gap:3px}.sw i{width:12px;height:21px;border-radius:4px;display:block}
.tn{font-size:10.5px;color:var(--text);font-weight:500}
.note{font-size:11px;color:var(--sub);line-height:1.75}
.sl{display:flex;align-items:center;gap:9px;padding:11px;border-radius:12px;background:var(--inset);
border:1px solid var(--line);font-size:12px;margin-bottom:10px}
.sl svg{width:15px;height:15px;flex-shrink:0}
.sl img{width:28px;height:28px;border-radius:50%;flex-shrink:0}

svg.c2{width:100%;height:auto;display:block}
.lgd{display:flex;gap:12px;flex-wrap:wrap;margin-top:11px;font-size:11px;color:var(--sub)}
.lgd span{display:inline-flex;align-items:center;gap:6px}
.lgd i{width:9px;height:9px;border-radius:3px}

/* nav */
nav.tb{position:fixed;bottom:0;inset-inline:0;max-width:640px;margin:0 auto;display:flex;z-index:30;
background:color-mix(in srgb,var(--surf) 93%,transparent);backdrop-filter:blur(18px);
border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:transparent;border:none;
color:var(--sub);padding:5px 2px;cursor:pointer;font-family:inherit;min-height:50px;position:relative;transition:color .16s}
.tab svg{width:19px;height:19px;position:relative;z-index:1}
.tab .l{font-size:9px;font-weight:500;white-space:nowrap;position:relative;z-index:1}
.tab.on{color:var(--acc)}
.tab.on::before{content:"";position:absolute;top:1px;width:40px;height:26px;border-radius:9px;
background:color-mix(in srgb,var(--acc) 13%,transparent)}
.tab:active{transform:scale(.92)}

#toast{position:fixed;bottom:calc(90px + env(safe-area-inset-bottom));inset-inline-start:50%;
transform:translateX(-50%) translateY(8px);background:linear-gradient(165deg,var(--pa),var(--pb));
border:1px solid var(--grn);border-radius:13px;padding:11px 16px;display:flex;align-items:center;gap:9px;
font-size:12.5px;box-shadow:0 10px 30px rgba(0,0,0,.35);z-index:80;max-width:88%;opacity:0;pointer-events:none;
transition:opacity .22s,transform .22s}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.warn{border-color:var(--red)}
#toast svg{width:15px;height:15px;flex-shrink:0}

::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}

@media(min-width:900px){
 body{display:flex;align-items:center;justify-content:center;padding:26px}
 #app{max-width:1360px;width:96vw;height:min(93vh,920px);border-radius:24px;overflow:hidden;
  flex-direction:row;box-shadow:0 30px 90px rgba(0,0,0,.5),0 0 0 1px var(--line)}
 header{width:248px;flex-shrink:0;border-inline-end:1px solid var(--line);border-bottom:none;
  display:flex;flex-direction:column;padding:24px 17px 18px;position:static;backdrop-filter:none}
 .htop{flex-direction:column;align-items:stretch;gap:16px}
 .msw{width:100%;justify-content:space-between}.ml{flex:1}
 .ptitle{display:none}
 main{padding:28px 32px 32px}
 .sec{display:flex;flex-flow:row wrap;gap:17px;align-items:flex-start}
 .sec>.hero,.sec>.wide{flex:1 1 100%}
 .sec>.card{flex:1 1 410px;min-width:0}

function plAr(n,one,two,few){if(st.lang!=="ar")return n+" "+(n===1?one:few);
 if(n===1)return one+" واحد";if(n===2)return two;if(n<=10)return n+" "+few;return n+" "+one}

function normalize(d){
 d.categories=d.categories||[];d.incomes=d.incomes||[];d.expenses=d.expenses||[];d.debts=d.debts||[];
 const RM={cat_food:"c_food",cat_transport:"c_transport",cat_housing:"c_housing",cat_health:"c_health",
  cat_investment:"c_invest",cat_subscriptions:"c_subs",cat_entertainment:"c_fun",cat_shopping:"c_shop",
  cat_education:"c_edu",cat_family:"c_family",cat_other:"c_other"};
 d.categories.forEach(c=>{if(RM[c.id])c.id=RM[c.id]});
 d.expenses.forEach(e=>{if(RM[e.categoryId])e.categoryId=RM[e.categoryId]});
 const seen=new Set();
 d.categories=d.categories.filter(c=>seen.has(c.id)?false:(seen.add(c.id),true));
 DEF.forEach(c=>{if(!seen.has(c.id))d.categories.push(JSON.parse(JSON.stringify(c)))});
 d.categories.forEach(c=>{if(!c.emoji)c.emoji="🏷️"});
 return d;
}
function loadData(){
 try{const raw=localStorage.getItem(K.data);if(raw)return normalize(JSON.parse(raw))}catch(e){}
 return {categories:JSON.parse(JSON.stringify(DEF)),incomes:[],expenses:[],debts:[]};
}

function docRef(){
 if(!db)return null;
 if(sync.user)return db.collection("mizan_users").doc(sync.user.uid);
 if(sync.code)return db.collection("finance_dashboards").doc(sync.code);
 return null;

function push(){const r=docRef();if(!r||remote)return;r.set(st.data).catch(e=>console.error("push",e))}
function attach(){
 const r=docRef();if(!r)return;
 sync.status="connecting";badge();
 if(unsub)unsub();
 unsub=r.onSnapshot(doc=>{
  sync.status="on";
  if(doc.exists){const d=doc.data();
   if((d.updatedAt||0)>(st.data.updatedAt||0)){
    remote=true;st.data=normalize({...d});lsS(K.data,JSON.stringify(st.data));remote=false;render();}
   else if((st.data.updatedAt||0)>(d.updatedAt||0))push();
  }else push();
  badge();
 },e=>{console.error("sync",e);sync.status="error";badge()});
}

const incOf=(m=st.month)=>st.data.incomes.filter(r=>r.month===m);
const expOf=(m=st.month)=>st.data.expenses.filter(r=>r.month===m);
const sum=a=>a.reduce((s,r)=>s+Number(r.amount||0),0);
const byId=id=>st.data.categories.find(c=>c.id===id);
function catSpend(m=st.month){const ex=expOf(m);
 return st.data.categories.map(c=>{const sp=ex.filter(e=>e.categoryId===c.id).reduce((s,e)=>s+Number(e.amount||0),0);
  return{...c,spent:sp,pct:c.budget>0?(sp/c.budget)*100:0}})}
function trend(){const ks=[];for(let i=5;i>=0;i--)ks.push(mSft(st.month,-i));
 return ks.map(k=>{const a=sum(incOf(k)),b=sum(expOf(k));return{k,label:mSh(k),income:a,expense:b,net:a-b}})}
function freqCats(){const c={};st.data.expenses.forEach(e=>{c[e.categoryId]=(c[e.categoryId]||0)+1});
 return st.data.categories.slice().sort((a,b)=>(c[b.id]||0)-(c[a.id]||0))}
function combos(){const s=new Set(),o=[];
 [...st.data.expenses].sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).forEach(e=>{
  const k=e.categoryId+"|"+e.amount;if(!s.has(k)&&o.length<4){s.add(k);o.push(e)}});return o}
function planOf(cs,income){
 const bt=cs.reduce((s,c)=>s+(Number(c.budget)||0),0);
 // Budgets that add up to more than income make every pace figure meaningless,
 // so the realistic ceiling is income.
 const plan=bt>0?(income>0?Math.min(bt,income):bt):income;
 return {bt,plan,unrealistic:income>0&&bt>income};
}
function payoff(bal,rate,pay){
 bal=Number(bal)||0;rate=Number(rate)||0;pay=Number(pay)||0;
 if(bal<=0)return{n:0,interest:0,ok:true};
 if(pay<=bal*rate)return{n:Infinity,interest:Infinity,ok:false};
 if(rate===0)return{n:Math.ceil(bal/pay),interest:0,ok:true};
 const n=Math.ceil(-Math.log(1-(bal*rate)/pay)/Math.log(1+rate));
 let b=bal,ti=0;for(let i=0;i<n&&i<600;i++){const it=b*rate;ti+=it;b=b+it-pay;if(b<0)b=0}
 return{n,interest:ti,ok:true}}

/* ============ Insights ============ */
function insights(){
 const out=[],cur=st.currency,now=new Date(),isCur=st.month===mKey();
 const ex=expOf(),inc=incOf(),tE=sum(ex),tI=sum(inc);
 const dim=dIn(st.month),day=isCur?now.getDate():dim;
 const cs=catSpend(),P=planOf(cs,tI),plan=P.plan;

 if(isCur){
  const td=dKey(now),ts=ex.filter(e=>txD(e)===td).reduce((s,e)=>s+Number(e.amount||0),0);
  const past=ex.filter(e=>txD(e)<td),ds=new Set(past.map(txD));
  const avg=ds.size?past.reduce((s,e)=>s+Number(e.amount||0),0)/ds.size:0;
  if(ts>0&&avg>0){const d=((ts-avg)/avg)*100;
   if(d>=50)out.push({lv:"danger",ic:"🔥",t:`صرفت النهاردة ${fmt(ts)} ${cur}`,
    b:`ده أعلى من متوسطك اليومي (${fmt(avg)}) بـ ${Math.round(d)}٪. لو اليوم ده اتكرر، الشهر هيتقفل بعجز.`});
   else if(d<=-40)out.push({lv:"good",ic:"👏",t:`يوم موفّر — ${fmt(ts)} ${cur} بس`,
    b:`أقل من متوسطك اليومي بـ ${Math.round(-d)}٪. كمّل كده.`});
   else out.push({lv:"info",ic:"📅",t:`صرفت النهاردة ${fmt(ts)} ${cur}`,b:`متوسطك اليومي ${fmt(avg)} — إنت في المعدل الطبيعي.`});
  }else if(ts===0&&day>1)out.push({lv:"good",ic:"✨",t:"النهاردة لسه من غير مصاريف",b:"كل يوم من غير صرف بيقرّبك من هدفك."});
 }
 if(plan>0&&day>2&&tE>0){const pr=(tE/day)*dim;
  if(pr>plan*1.1)out.push({lv:"danger",ic:"📈",t:`بالمعدل ده هتنهي الشهر بـ ${fmt(pr)} ${cur}`,
   b:`ده أعلى من خطتك (${fmt(plan)}) بـ ${fmt(pr-plan)}. محتاج تقلّل حوالي ${fmt((pr-plan)/Math.max(1,dim-day))} في اليوم.`});
  else if(pr<plan*.85)out.push({lv:"good",ic:"🎯",t:"ماشي أحسن من الخطة",
   b:`المتوقع تنهي الشهر بـ ${fmt(pr)} بدل ${fmt(plan)} — يعني توفير ${fmt(plan-pr)}.`});
 }
 if(plan>0&&isCur&&day<dim){const left=plan-tE,pd=left/(dim-day+1);
  if(left>0)out.push({lv:"info",ic:"🧮",t:`متاح ليك ${fmt(pd)} ${cur} في اليوم`,b:`فاضل ${fmt(left)} على ${dim-day+1} يوم لحد آخر الشهر.`});
  else out.push({lv:"danger",ic:"⛔",t:"خلّصت ميزانية الشهر",
   b:`تجاوزت بـ ${fmt(-left)} ${cur} وفاضل ${dim-day+1} يوم. أي صرف زيادة هيطلع من مدخراتك.`});
 }
 const over=cs.filter(c=>c.budget>0&&c.spent>c.budget).sort((a,b)=>(b.spent-b.budget)-(a.spent-a.budget));
 const near=cs.filter(c=>c.budget>0&&c.spent<=c.budget&&c.pct>=80);
 if(over.length)out.push({lv:"danger",ic:"⚠️",t:`تجاوزت الميزانية في ${plAr(over.length,"تصنيف","تصنيفين","تصنيفات")}`,
  b:over.slice(0,3).map(c=>`${c.emoji} ${cNm(c)}: ${fmt(c.spent)} من ${fmt(c.budget)}`).join(" · ")});
 if(near.length)out.push({lv:"warn",ic:"🔔",t:`قربت تخلّص ميزانية ${plAr(near.length,"تصنيف","تصنيفين","تصنيفات")}`,
  b:near.slice(0,3).map(c=>`${c.emoji} ${cNm(c)}: ${Math.round(c.pct)}٪`).join(" · ")});
 const top=cs.filter(c=>c.spent>0).sort((a,b)=>b.spent-a.spent)[0];
 if(top&&tE>0){const sh=Math.round((top.spent/tE)*100);
  out.push({lv:sh>45?"warn":"info",ic:top.emoji,t:`أكتر بند: ${cNm(top)} — ${fmt(top.spent)} ${cur}`,
   b:`بياخد ${sh}٪ من مصاريف الشهر.${sh>45?" نسبة عالية — لو عايز توفر، ابدأ من هنا.":""}`})}
 const big=[...ex].sort((a,b)=>b.amount-a.amount)[0];
 if(big&&tE>0&&big.amount>tE*.25){const c=byId(big.categoryId);
  out.push({lv:"info",ic:"💸",t:`أكبر عملية: ${fmt(big.amount)} ${cur}`,
   b:`${c?c.emoji+" "+cNm(c):""}${big.note?" — "+big.note:""} · لوحدها ${Math.round(big.amount/tE*100)}٪ من الشهر.`})}
 const pm=mSft(st.month,-1),pe=sum(expOf(pm));
 if(pe>0&&tE>0){const d=((tE-pe)/pe)*100;
  if(Math.abs(d)>=12)out.push({lv:d>0?"warn":"good",ic:d>0?"⬆️":"⬇️",
   t:`مصاريفك ${d>0?"أعلى":"أقل"} من ${mLab(pm)} بـ ${Math.abs(Math.round(d))}٪`,b:`${fmt(tE)} مقابل ${fmt(pe)} ${cur}.`})}
 const pcs=catSpend(pm),drop=pcs.filter(p=>p.spent>0&&!cs.find(c=>c.id===p.id&&c.spent>0));
 if(drop.length)out.push({lv:"good",ic:"🚫",t:`ما صرفتش في ${plAr(drop.length,"بند","بندين","بنود")} الشهر ده`,
  b:drop.slice(0,4).map(c=>`${c.emoji} ${cNm(c)} (كان ${fmt(c.spent)})`).join(" · ")});
 if(tI>0){const r=((tI-tE)/tI)*100;
  if(r<0)out.push({lv:"danger",ic:"🩸",t:"بتصرف أكتر من دخلك",b:`العجز ${fmt(tE-tI)} ${cur} الشهر ده. ده بيتغطى من مدخرات أو ديون.`});
  else if(r>=25)out.push({lv:"good",ic:"🏆",t:`بتوفّر ${Math.round(r)}٪ من دخلك`,b:`${fmt(tI-tE)} ${cur} فايض. نسبة ممتازة — حافظ عليها.`});
  else if(r<10)out.push({lv:"warn",ic:"📉",t:`نسبة ادخارك ${Math.round(r)}٪ بس`,b:`فايض ${fmt(tI-tE)} ${cur}. حاول توصلها 20٪ على الأقل.`})}
 if(P.unrealistic)out.push({lv:"warn",ic:"🧾",t:`مجموع ميزانياتك أكبر من دخلك`,
  b:`الميزانيات ${fmt(P.bt)} والدخل ${fmt(tI)} ${cur} — فرق ${fmt(P.bt-tI)}. حسبت خطتك على الدخل عشان الأرقام تبقى واقعية، لكن يستحسن تراجع الميزانيات.`});
 const ds2=st.data.debts||[];
 if(ds2.length){const tb=ds2.reduce((s,d)=>s+Number(d.balance||0),0);
  const w=ds2.map(d=>({...d,r:payoff(d.balance,(Number(d.rate)||0)/100,d.monthlyPay)}))
   .sort((a,b)=>(Number(b.rate)||0)-(Number(a.rate)||0))[0];
  if(w&&!w.r.ok)out.push({lv:"danger",ic:"🆘",t:`"${w.name}" رصيده بيزيد مش بينقص`,
   b:"الدفعة الشهرية أقل من الفايدة. لازم تزوّدها فوراً وإلا الدين هيكبر للأبد."});
  else if(w&&isFinite(w.r.n)&&w.r.n>0)out.push({lv:"info",ic:"💳",t:`إجمالي ديونك ${fmt(tb)} ${cur}`,
   b:`أغلاهم "${w.name}" — هيخلص بعد ${w.r.n} شهر وهيكلفك ${fmt(w.r.interest)} فوايد. ابدأ بيه.`})}
 const ord={danger:0,warn:1,good:2,info:3};
 return out.sort((a,b)=>ord[a.lv]-ord[b.lv]);
}

function ring(pct,over){
 const R=36,C=2*Math.PI*R,p=Math.max(0,Math.min(100,pct));
 return `<div class="ring"><svg width="84" height="84" viewBox="0 0 84 84">
 <circle cx="42" cy="42" r="${R}" fill="none" stroke="var(--inset)" stroke-width="7"/>
 <circle cx="42" cy="42" r="${R}" fill="none" stroke="${over?"var(--red)":"var(--acc)"}" stroke-width="7"
  stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p/100)}"
  style="transition:stroke-dashoffset .6s cubic-bezier(.3,.8,.3,1)"/></svg>
 <div class="ringtx"><b style="color:${over?"var(--red)":"var(--text)"}">${Math.round(pct)}%</b><i>${t("used")}</i></div></div>`;
}
function donut(items,w=230,h=230){
 const tot=items.reduce((s,d)=>s+d.value,0);if(!tot)return"";
 const cx=w/2,cy=h/2,R=88,r=55;let a=-90,o="";
 items.forEach(d=>{const sw=(d.value/tot)*360,big=sw>180?1:0;
  const s=a*Math.PI/180,e=(a+sw)*Math.PI/180;
  const x1=cx+R*Math.cos(s),y1=cy+R*Math.sin(s),x2=cx+R*Math.cos(e),y2=cy+R*Math.sin(e);
  const i1=cx+r*Math.cos(s),j1=cy+r*Math.sin(s),i2=cx+r*Math.cos(e),j2=cy+r*Math.sin(e);
  o+=`<path d="M${x1},${y1} A${R},${R} 0 ${big} 1 ${x2},${y2} L${i2},${j2} A${r},${r} 0 ${big} 0 ${i1},${j1} Z" fill="${d.color}" stroke="var(--pa)" stroke-width="2.5"/>`;
  a+=sw});
 return `<svg class="c2" viewBox="0 0 ${w} ${h}" style="max-width:230px;margin:0 auto">${o}
 <text x="${cx}" y="${cy+6}" text-anchor="middle" fill="var(--text)" font-size="18" font-weight="700" font-family="JetBrains Mono">${fmt(tot)}</text></svg>`}
function bars(d,w=560,h=215){
 const p={l:38,r:10,t:10,b:24},iw=w-p.l-p.r,ih=h-p.t-p.b;
 const mx=Math.max(1,...d.map(x=>Math.max(x.income,x.expense)));
 const gw=iw/d.length,bw=gw*.3;let o="";
 d.forEach((x,i)=>{const gx=p.l+i*gw+gw*.16,hi=(x.income/mx)*ih,he=(x.expense/mx)*ih;
  o+=`<rect x="${gx}" y="${p.t+ih-hi}" width="${bw}" height="${hi}" rx="4" fill="var(--grn)"/>`;
  o+=`<rect x="${gx+bw+4}" y="${p.t+ih-he}" width="${bw}" height="${he}" rx="4" fill="var(--red)"/>`});
 const g=[0,.5,1].map(f=>`<line x1="${p.l}" y1="${p.t+ih*(1-f)}" x2="${w-p.r}" y2="${p.t+ih*(1-f)}" stroke="var(--line)" stroke-dasharray="3,4"/>`).join("");
 const l=d.map((x,i)=>`<text x="${p.l+i*gw+gw/2}" y="${h-5}" fill="var(--sub)" font-size="11" text-anchor="middle" font-family="IBM Plex Sans Arabic">${x.label}</text>`).join("");
 return `<svg class="c2" viewBox="0 0 ${w} ${h}">${g}${o}${l}</svg>`}

/* ============ Add / Edit sheet ============ */
const ad={kind:"e",amount:"",cat:null,note:"",date:null,source:"",editId:null,allCats:false};
function openAdd(kind){
 ad.kind=kind||"e";ad.amount="";ad.note="";ad.source="";ad.editId=null;ad.allCats=false;
 ad.date=dKey();const f=freqCats();ad.cat=f[0]?f[0].id:null;sheet()}
function editTx(kind,id){
 const r=(kind==="e"?st.data.expenses:st.data.incomes).find(x=>x.id===id);
 if(!r)return;
 ad.kind=kind;ad.editId=id;ad.allCats=false;ad.amount=String(r.amount||"");ad.note=r.note||"";
 ad.source=r.source||"";ad.date=txD(r);ad.cat=r.categoryId||freqCats()[0]?.id||null;sheet()}
function closeAdd(){
 const s=document.getElementById("scrim"),h=document.getElementById("sheet");
 if(s)s.classList.remove("on");if(h)h.classList.remove("on");
 setTimeout(()=>{document.getElementById("sheetHost").innerHTML=""},240)}
function sheet(){
 const cats=freqCats(),cur=esc(st.currency),rec=combos(),amt=ad.amount||"0";
 const ttl=ad.editId?(ad.kind==="e"?t("editExp"):t("editInc")):(ad.kind==="e"?t("addExp"):t("addInc"));
 document.getElementById("sheetHost").innerHTML=`
 <div class="scrim" id="scrim" onclick="closeAdd()"></div>
 <div class="sheet" id="sheet"><div class="grab"></div>
  <div class="stitle"><span>${ttl}</span><button class="xb" onclick="closeAdd()">${I.x}</button></div>
  ${ad.editId?"":`<div class="seg ${ad.kind==="e"?"ex":"in"}">
   <button class="${ad.kind==="e"?"on":""}" onclick="setKind('e')">${t("expense")}</button>
   <button class="${ad.kind==="i"?"on":""}" onclick="setKind('i')">${t("income")}</button></div>`}
  <div class="amt"><div class="v" style="color:${ad.kind==="e"?"var(--red)":"var(--grn)"}">${esc(amt)}</div><div class="c">${cur}</div></div>
  ${ad.kind==="e"&&rec.length&&!ad.amount&&!ad.editId?`<div class="chips">${rec.map(r=>{const c=byId(r.categoryId);
   return c?`<button class="chip q" onclick="useC('${r.categoryId}',${r.amount})"><span class="e">${c.emoji}</span><b>${fmt(r.amount)}</b></button>`:""}).join("")}</div>`:""}
  ${ad.kind==="e"?(()=>{const show=ad.allCats?cats:cats.slice(0,6);
    const sel=cats.find(c=>c.id===ad.cat);
    if(sel&&!show.find(c=>c.id===sel.id))show.unshift(sel);
    return `<div class="chips">${show.map(c=>`<button class="chip${ad.cat===c.id?" on":""}" onclick="pickC('${c.id}')">
    <span class="e">${c.emoji}</span>${esc(cNm(c))}</button>`).join("")}
    ${!ad.allCats&&cats.length>show.length?`<button class="chip q" onclick="moreCats()">+${cats.length-show.length} ${t("more")}</button>`:""}</div>`})()
   :`<div class="fld"><input id="srcI" placeholder="${t("srcPh")}" value="${esc(ad.source)}" oninput="ad.source=this.value"></div>`}
  <div class="kp">${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="key" onclick="kp('${n}')">${n}</button>`).join("")}
   <button class="key" onclick="kp('00')">00</button><button class="key" onclick="kp('0')">0</button>
   <button class="key" onclick="kp('del')">${I.back}</button></div>
  <div class="fld"><input id="noteI" placeholder="${t("note")} (${t("optional")})" value="${esc(ad.note)}" oninput="ad.note=this.value"></div>
  <div class="fld"><label class="fl">${t("date")}</label><input type="date" value="${ad.date}" onchange="ad.date=this.value"></div>
  <button class="btn" onclick="saveTx()">${I.ok}${t("save")}</button></div>`;
 requestAnimationFrame(()=>{const s=document.getElementById("scrim"),h=document.getElementById("sheet");
  if(s)s.classList.add("on");if(h)h.classList.add("on")})}
function moreCats(){ad.allCats=true;sheet()}
function setKind(k){ad.kind=k;sheet()}
function pickC(id){ad.cat=id;
 document.querySelectorAll("#sheet .chip").forEach(el=>el.classList.remove("on"));
 const b=[...document.querySelectorAll("#sheet .chip")].find(el=>el.getAttribute("onclick")===`pickC('${id}')`);
 if(b)b.classList.add("on")}
function useC(c,a){ad.cat=c;ad.amount=String(a);sheet()}
function kp(v){
 const had=!!ad.amount;
 if(v==="del")ad.amount=ad.amount.slice(0,-1);
 else{if(ad.amount.length>9)return;ad.amount=(ad.amount==="0"?"":ad.amount)+v}
 const el=document.querySelector(".amt .v");if(el)el.textContent=ad.amount||"0";
 if(!had&&ad.amount)sheet(); // hide quick chips once typing starts
}
function saveTx(){
 const amount=Number(ad.amount);
 if(!(amount>0)){toast(t("needAmt"),1);return}
 const date=ad.date||dKey(),month=date.slice(0,7);
 if(ad.kind==="i"){
  const src=(ad.source||"").trim()||t("income");
  if(ad.editId){const r=st.data.incomes.find(x=>x.id===ad.editId);
   if(r){r.amount=amount;r.source=src;r.date=date;r.month=month}toast(t("upd"))}
  else{st.data.incomes.push({id:uid("inc"),month,date,source:src,amount,createdAt:Date.now()});toast(t("svI"))}
 }else{
  if(!ad.cat){toast(t("needCat"),1);return}
  if(ad.editId){const r=st.data.expenses.find(x=>x.id===ad.editId);
   if(r){r.amount=amount;r.categoryId=ad.cat;r.note=(ad.note||"").trim();r.date=date;r.month=month}toast(t("upd"))}
  else{
   st.data.expenses.push({id:uid("exp"),month,date,categoryId:ad.cat,amount,note:(ad.note||"").trim(),createdAt:Date.now()});
   const c=byId(ad.cat);
   const sp=st.data.expenses.filter(e=>e.month===month&&e.categoryId===ad.cat).reduce((s,e)=>s+Number(e.amount||0),0);
   if(c&&c.budget>0&&sp>c.budget)toast(t("ovr",cNm(c)),1);else toast(t("sv"));
  }}
 save();closeAdd();if(month!==st.month)st.month=month;
 setTimeout(()=>render(),250)}

function expCSV(all){
 const rows=[["التاريخ","النوع","التصنيف / المصدر","المبلغ","الملاحظة"]];
 const E=all?st.data.expenses:expOf(),N=all?st.data.incomes:incOf();
 const items=[...N.map(r=>({d:txD(r),k:"دخل",n:r.source,a:r.amount,no:""})),
  ...E.map(r=>{const c=byId(r.categoryId);return{d:txD(r),k:"مصروف",n:c?cNm(c):"—",a:r.amount,no:r.note||""}})]
  .sort((a,b)=>a.d.localeCompare(b.d));
 items.forEach(i=>rows.push([i.d,i.k,i.n,i.a,i.no]));
 rows.push([]);rows.push(["إجمالي الدخل","","",sum(N),""]);rows.push(["إجمالي المصروفات","","",sum(E),""]);
 const csv=rows.map(r=>r.map(c=>{const s=String(c==null?"":c);
  return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}).join(",")).join("\r\n");
 dl(`mizan-${all?"all":st.month}.csv`,"﻿"+csv,"text/csv;charset=utf-8;");toast(t("exported"))}
function expJSON(){dl(`mizan-backup-${mKey()}.json`,JSON.stringify(st.data,null,2),"application/json")}
function impJSON(inp){const f=inp.files&&inp.files[0];if(!f)return;
 if(!confirm(t("impAsk"))){inp.value="";return}
 const r=new FileReader();
 r.onload=()=>{try{st.data=normalize(JSON.parse(r.result));persist();render();toast(t("imported"))}
  catch(e){alert("ملف غير صالح")}inp.value=""};
 r.readAsText(f)}
function resetAll(){if(!confirm(t("resetAsk")))return;
 st.data={categories:JSON.parse(JSON.stringify(DEF)),incomes:[],expenses:[],debts:[]};
 persist();render();toast(t("del"))}

/* ============ Sync / Auth ============ */
const mkC=()=>Math.random().toString(36).slice(2,6).toUpperCase()+"-"+Math.random().toString(36).slice(2,6).toUpperCase();
function mkCode(){const c=mkC();const f=document.getElementById("syncF");if(f)f.value=c;startCode(c);paint();toast("الكود اتعمل ✓")}
function joinCode(){const f=document.getElementById("syncF");const c=f?f.value.trim():"";if(!c)return;startCode(c);paint();toast(t("syncWait"))}
function offCode(){stopCode();paint()}
function gIn(){
 if(!auth){toast("المزامنة مش متاحة",1);return}
 if(sync.busy)return;sync.busy=true;toast(t("gWait"));
 const p=new firebase.auth.GoogleAuthProvider();
 p.setCustomParameters({prompt:"select_account"});
 // Popup only. signInWithRedirect silently loses its result when the app is
 // served from a different origin than authDomain (Chrome storage partitioning),
 // so falling back to it would strand the user instead of signing them in.
 auth.signInWithPopup(p)
  .then(()=>{sync.busy=false})
  .catch(err=>{
   sync.busy=false;
   const c=(err&&err.code)||"";
   if(c==="auth/popup-closed-by-user"||c==="auth/cancelled-popup-request"){
    const el=document.getElementById("toast");if(el)el.className="";return}
   if(c==="auth/popup-blocked"){toast(t("gBlocked"),1);return}
   if(c==="auth/unauthorized-domain"){toast(t("gDomain"),1);return}
   console.error(err);toast(t("gFail")+" ("+c+")",1);
  })}
function gOut(){if(!auth)return;
 if(unsub){unsub();unsub=null}
 sync.status="off";
 auth.signOut().then(()=>{sync.user=null;render()})}

/* ============ Install ============ */
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();prompt_=e});
function doInstall(){if(!prompt_){toast("من قايمة المتصفح اختار «تثبيت التطبيق»",1);return}
 prompt_.prompt();prompt_.userChoice.finally(()=>{prompt_=null})}

Object.assign(window,{go,shiftM,openAdd,closeAdd,setKind,moreCats,pickC,useC,kp,saveTx,editTx,setF,
 delExp,delInc,delCat,addCat,editB,addDebt,delDebt,setTheme,setLang,setCur,
 expCSV,expJSON,impJSON,resetAll,mkCode,joinCode,offCode,gIn,gOut,doInstall,ad});

/* ============ Boot ============ */
(function boot(){
 const r=document.getElementById("root");
 r.setAttribute("lang",st.lang);r.setAttribute("dir",st.lang==="ar"?"rtl":"ltr");
 r.setAttribute("data-theme",st.theme);
 render();
 const m=document.querySelector('meta[name="theme-color"]');
 if(m)m.setAttribute("content",getComputedStyle(document.body).backgroundColor);

 if(FB_ON&&auth){
  auth.onAuthStateChanged(u=>{
   const was=sync.user&&sync.user.uid;
   sync.user=u?{uid:u.uid,email:u.email,displayName:u.displayName,photoURL:u.photoURL}:null;
   if(unsub){unsub();unsub=null}
   if(u){attach()}
   else{const c=lsG(K.sync,"");if(c){sync.code=c;attach()}else{sync.status="off"}}
   if(was!==(u&&u.uid))render();else{badge();if(st.tab==="set")paint()}
  });
  try{auth.getRedirectResult().catch(e=>{if(e&&e.code)console.error("redirect",e.code)})}catch(e){}
 }else if(FB_ON){
  const c=lsG(K.sync,"");if(c)startCode(c);
 }

 if("serviceWorker" in navigator){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
 }
 try{const q=new URLSearchParams(location.search);
  if(q.get("quick")==="expense")setTimeout(()=>openAdd("e"),300);
  if(q.get("quick")==="income")setTimeout(()=>openAdd("i"),300);
  if(q.get("view")==="today"){st.tab="log";render()}
  if(q.toString())history.replaceState({},"",location.pathname)}catch(e){}
})();
</script>
