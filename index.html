<!DOCTYPE html>
<html lang="ar" dir="rtl" id="root" data-theme="midnight">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0F1113">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ميزان">
<title>ميزان — إدارة مالية</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
:root,[data-theme="midnight"]{--bg:#0F1113;--surf:#15181B;--pa:#1C2126;--pb:#171B1F;--inset:#111518;
--line:#272D33;--line2:#1F252A;--text:#F3EFE6;--sub:#8E887A;--dim:#625D53;
--acc:#D6B262;--acc2:#B08F3E;--ink:#14181B;--grn:#74A67F;--red:#D4756C;--amb:#DBA646;
--g1:#192C23;--g2:#241B33}
[data-theme="ocean"]{--bg:#0A1016;--surf:#0F1821;--pa:#15212C;--pb:#111B24;--inset:#0C141B;
--line:#213240;--line2:#1A2731;--text:#EAF2F7;--sub:#7D94A4;--dim:#59707E;
--acc:#51B7C8;--acc2:#2E8EA0;--ink:#06121A;--grn:#5FB490;--red:#D4756C;--amb:#DBA646;--g1:#0D3341;--g2:#142A45}
[data-theme="forest"]{--bg:#0C1210;--surf:#111A15;--pa:#17231C;--pb:#131D18;--inset:#0E1712;
--line:#233326;--line2:#1C2A20;--text:#EEF4EB;--sub:#889880;--dim:#5F6E58;
--acc:#93C46D;--acc2:#6E9E4C;--ink:#0B1409;--grn:#82C492;--red:#D4756C;--amb:#DBA646;--g1:#15351F;--g2:#22301A}
[data-theme="plum"]{--bg:#110C14;--surf:#18121D;--pa:#211928;--pb:#1A1421;--inset:#140E19;
--line:#302439;--line2:#271D2E;--text:#F2EBF5;--sub:#9888A2;--dim:#6E6078;
--acc:#BC8EDB;--acc2:#9565B8;--ink:#120C15;--grn:#74A67F;--red:#DC7189;--amb:#DBA646;--g1:#33194A;--g2:#4A1D38}
[data-theme="graphite"]{--bg:#0D0E0F;--surf:#141617;--pa:#1D2021;--pb:#181A1C;--inset:#121415;
--line:#2A2E30;--line2:#212527;--text:#EEEFF0;--sub:#8B8F92;--dim:#64686B;
--acc:#C6CBCF;--acc2:#9DA3A8;--ink:#141617;--grn:#7AAC8D;--red:#CB7F77;--amb:#DBA646;--g1:#1E2427;--g2:#22262A}
[data-theme="sand"]{--bg:#F4F1EA;--surf:#FCFAF7;--pa:#FFFFFF;--pb:#FBF9F5;--inset:#F2EEE7;
--line:#E3DCCE;--line2:#EBE5DB;--text:#202427;--sub:#7A7363;--dim:#9A937F;
--acc:#A87B2C;--acc2:#8A651D;--ink:#FFFFFF;--grn:#3E7A4F;--red:#B04A42;--amb:#97690F;--g1:#EAE3D3;--g2:#F0E7DD}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{touch-action:manipulation;-webkit-text-size-adjust:100%}
body{background:radial-gradient(1200px 600px at 10% -14%,var(--g1),transparent 60%),
radial-gradient(950px 500px at 115% 0%,var(--g2),transparent 56%),var(--bg);
color:var(--text);font-family:'IBM Plex Sans Arabic',sans-serif;-webkit-font-smoothing:antialiased;
min-height:100vh;line-height:1.6;overflow-x:hidden;overscroll-behavior-y:contain;transition:background .3s}
#app{max-width:640px;margin:0 auto;min-height:100vh;background:var(--surf);display:flex;
flex-direction:column;box-shadow:0 0 60px rgba(0,0,0,.3);position:relative;overflow-x:hidden}

/* header */
header{padding:calc(13px + env(safe-area-inset-top)) 18px 0;border-bottom:1px solid var(--line);
position:sticky;top:0;background:color-mix(in srgb,var(--surf) 88%,transparent);backdrop-filter:blur(18px);z-index:20}
.htop{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:36px;height:36px;border-radius:11px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
background:linear-gradient(145deg,var(--acc),var(--acc2) 130%);
box-shadow:0 4px 14px color-mix(in srgb,var(--acc) 28%,transparent),inset 0 1px 0 rgba(255,255,255,.22)}
.mark svg{width:20px;height:20px}
.bt{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15.5px;letter-spacing:.3px;line-height:1.2}
.bs{font-size:10px;color:var(--sub);display:flex;align-items:center;gap:5px;margin-top:1px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--sub);flex-shrink:0}
.dot.ok{background:var(--grn);box-shadow:0 0 6px var(--grn)}
.dot.cl{background:var(--acc);box-shadow:0 0 6px var(--acc)}
.avbtn{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:var(--inset);
cursor:pointer;overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;padding:0;color:var(--sub)}
.avbtn img{width:100%;height:100%;object-fit:cover;display:block}
.avbtn svg{width:17px;height:17px}
.avbtn.on{border-color:var(--acc)}

.msw{display:inline-flex;align-items:center;gap:1px;background:var(--inset);border:1px solid var(--line);
border-radius:20px;padding:3px 4px;flex-shrink:0;width:fit-content}
.mb{width:27px;height:27px;border-radius:50%;border:none;background:transparent;color:var(--text);
display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .14s}
.mb:active{background:var(--line2)}
.mb svg{width:13px;height:13px}
.ml{font-family:'JetBrains Mono',monospace;font-size:11px;min-width:80px;text-align:center;font-weight:500}
.ptitle{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;padding:13px 0 15px;letter-spacing:.2px}

main{flex:1;overflow-y:auto;overflow-x:hidden;padding:15px 15px 118px}
.sec{display:flex;flex-direction:column;gap:13px;animation:rise .26s cubic-bezier(.2,.7,.3,1)}
@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

.card{background:linear-gradient(168deg,var(--pa),var(--pb));border:1px solid var(--line);
border-radius:17px;padding:16px;box-shadow:0 1px 2px rgba(0,0,0,.14),0 6px 18px rgba(0,0,0,.14)}
.ch{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;margin-bottom:13px;
display:flex;align-items:center;gap:8px;letter-spacing:.2px}
.ch svg{width:15px;height:15px;color:var(--acc);flex-shrink:0}
.ch .sp{margin-inline-start:auto;font-family:'JetBrains Mono',monospace;font-size:11.5px;font-weight:600;color:var(--sub)}

/* hero */
.hero{background:linear-gradient(165deg,var(--pa),var(--pb));border:1px solid var(--line);
border-radius:19px;padding:17px;box-shadow:0 1px 2px rgba(0,0,0,.14),0 8px 24px rgba(0,0,0,.16);
display:flex;align-items:center;gap:16px}
.hmeta{flex:1;min-width:0}
.hlab{font-size:11px;color:var(--sub);font-weight:500}
.hval{font-family:'JetBrains Mono',monospace;font-size:29px;font-weight:700;letter-spacing:-.8px;line-height:1.2;margin:2px 0 11px}
.hval small{font-size:12px;font-weight:400;color:var(--sub);letter-spacing:0}
.hrow{display:flex;gap:8px}
.hcell{flex:1;background:var(--inset);border:1px solid var(--line2);border-radius:11px;padding:8px 10px;min-width:0}
.hcell .l{font-size:9.5px;color:var(--sub);display:flex;align-items:center;gap:4px}
.hcell .l svg{width:11px;height:11px}
.hcell .v{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;margin-top:2px;
overflow:hidden;text-overflow:ellipsis}
.ring{width:84px;height:84px;flex-shrink:0;position:relative}
.ring svg{transform:rotate(-90deg)}
.ringtx{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringtx b{font-family:'JetBrains Mono',monospace;font-size:16px;line-height:1}
.ringtx i{font-size:8.5px;color:var(--sub);font-style:normal;margin-top:2px}

/* insights */
.ins{display:flex;gap:11px;align-items:flex-start;border-radius:13px;padding:12px 13px;
background:var(--inset);border:1px solid var(--line2);border-inline-start:3px solid var(--sub)}
.ins+.ins{margin-top:8px}
.ins .ic{font-size:16px;line-height:1.25;flex-shrink:0}
.ins .t{font-size:12.5px;font-weight:700;line-height:1.5}
.ins .b{font-size:11.5px;color:var(--sub);line-height:1.7;margin-top:2px}
.ins.danger{border-inline-start-color:var(--red)} .ins.danger .t{color:var(--red)}
.ins.warn{border-inline-start-color:var(--amb)} .ins.warn .t{color:var(--amb)}
.ins.good{border-inline-start-color:var(--grn)} .ins.good .t{color:var(--grn)}
.ins.info{border-inline-start-color:var(--acc)}

/* budget bars */
.brow{margin-bottom:13px}.brow:last-child{margin-bottom:0}
.btop{display:flex;justify-content:space-between;align-items:center;gap:9px;margin-bottom:6px;font-size:12.5px}
.bnm{display:flex;align-items:center;gap:7px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bamt{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--sub);white-space:nowrap}
.track{height:6px;border-radius:4px;background:var(--inset);overflow:hidden}
.fill{height:100%;border-radius:4px;transition:width .5s cubic-bezier(.3,.8,.3,1)}

.empty{display:flex;flex-direction:column;align-items:center;gap:9px;padding:28px 14px;
color:var(--dim);font-size:12.5px;text-align:center;line-height:1.8}
.empty svg{width:25px;height:25px;opacity:.45}

/* rows */
.row{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line2)}
.row:last-child{border-bottom:none}
.row.tap{cursor:pointer}
.row.tap:active{opacity:.6}
.rico{width:35px;height:35px;border-radius:11px;display:flex;align-items:center;justify-content:center;
font-size:15px;flex-shrink:0;background:color-mix(in srgb,var(--tone,var(--acc)) 13%,transparent)}
.rmain{flex:1;min-width:0}
.rt{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rs{font-size:11px;color:var(--sub);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ra{font-family:'JetBrains Mono',monospace;font-size:13.5px;font-weight:700;white-space:nowrap}
.ib{width:33px;height:33px;border-radius:10px;border:1px solid var(--line);background:var(--inset);
color:var(--sub);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.ib svg{width:14px;height:14px}
.ib:active{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,transparent)}
.dsep{font-size:11px;color:var(--sub);font-weight:600;padding:13px 0 3px;display:flex;justify-content:space-between}
.dsep b{font-family:'JetBrains Mono',monospace;color:var(--red);font-weight:600}

/* form */
input,select{width:100%;background:var(--inset);border:1px solid var(--line);border-radius:11px;
padding:11px 13px;color:var(--text);font-family:inherit;font-size:16px;outline:none;min-height:46px;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 13%,transparent)}
input::placeholder{color:var(--dim)}
label.fl{font-size:11px;color:var(--sub);font-weight:500;display:block;margin-bottom:5px}
.fld{margin-bottom:10px}
.frow{display:flex;gap:9px}.frow>.fld{flex:1;margin-bottom:0}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:12px;
padding:13px 18px;font-family:inherit;font-weight:700;font-size:14.5px;cursor:pointer;min-height:48px;width:100%;
background:linear-gradient(145deg,var(--acc),var(--acc2));color:var(--ink);
box-shadow:0 4px 14px color-mix(in srgb,var(--acc) 22%,transparent),inset 0 1px 0 rgba(255,255,255,.2);
transition:transform .13s,box-shadow .13s}
.btn svg{width:17px;height:17px}
.btn:active{transform:scale(.982)}
.btn.ghost{background:var(--inset);color:var(--text);border:1px solid var(--line);box-shadow:none}
.btn.danger{background:transparent;color:var(--red);border:1px solid color-mix(in srgb,var(--red) 38%,transparent);box-shadow:none}
.btn.google{background:#fff;color:#1f1f1f;border:1px solid #dadce0;box-shadow:0 2px 8px rgba(0,0,0,.14)}
.btn.google svg{width:18px;height:18px}
.pill{font-family:'JetBrains Mono',monospace;font-size:11.5px;padding:5px 11px;border-radius:20px;font-weight:600;
white-space:nowrap;background:color-mix(in srgb,var(--grn) 13%,transparent);color:var(--grn);
border:1px solid color-mix(in srgb,var(--grn) 24%,transparent)}
.pill.exp{background:color-mix(in srgb,var(--red) 13%,transparent);color:var(--red);
border-color:color-mix(in srgb,var(--red) 24%,transparent)}

/* FAB */
.fab{position:fixed;bottom:calc(76px + env(safe-area-inset-bottom));
inset-inline-end:max(17px,calc(50vw - 320px + 17px));width:56px;height:56px;border-radius:18px;border:none;
z-index:40;cursor:pointer;background:linear-gradient(145deg,var(--acc),var(--acc2));color:var(--ink);
box-shadow:0 7px 24px color-mix(in srgb,var(--acc) 40%,transparent),inset 0 1px 0 rgba(255,255,255,.25);
display:flex;align-items:center;justify-content:center;transition:transform .14s}
.fab svg{width:25px;height:25px}
.fab:active{transform:scale(.92)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(3,5,7,.68);backdrop-filter:blur(3px);z-index:50;opacity:0;transition:opacity .22s}
.scrim.on{opacity:1}
.sheet{position:fixed;inset-inline:0;bottom:0;z-index:51;background:var(--surf);border-radius:22px 22px 0 0;
border-top:1px solid var(--line);max-width:640px;margin:0 auto;max-height:94vh;overflow-y:auto;
padding:9px 16px calc(16px + env(safe-area-inset-bottom));transform:translateY(100%);
transition:transform .27s cubic-bezier(.2,.8,.3,1)}
.sheet.on{transform:translateY(0)}
.grab{width:38px;height:4px;border-radius:3px;background:var(--line);margin:3px auto 11px}
.stitle{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15.5px;margin-bottom:12px;
display:flex;justify-content:space-between;align-items:center}
.xb{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--inset);
color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer}
.xb svg{width:14px;height:14px}

.seg{display:flex;background:var(--inset);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px;margin-bottom:12px}
.seg button{flex:1;border:none;background:transparent;color:var(--sub);border-radius:9px;padding:9px;
font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}
.seg button.on{background:linear-gradient(145deg,var(--acc),var(--acc2));color:var(--ink)}
.seg.wide button{font-size:12.5px;padding:10px 4px}
.item{padding:12px 0;border-bottom:1px solid var(--line2)}
.item:last-child{border-bottom:none;padding-bottom:2px}
.sub-h{font-size:11px;font-weight:700;color:var(--sub);letter-spacing:.3px;
 margin:14px 0 2px;padding-top:12px;border-top:1px solid var(--line2)}
.tagl{font-size:9.5px;font-weight:600;color:var(--grn);background:color-mix(in srgb,var(--grn) 14%,transparent);
 border-radius:5px;padding:1px 5px;margin-inline-start:5px;vertical-align:1px}
.chk{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--sub);
 padding:10px 0;cursor:pointer}
.chk input{width:17px;height:17px;accent-color:var(--acc);flex-shrink:0}
.nwtop{margin-bottom:12px}
.nwbig{font-family:'JetBrains Mono',monospace;font-size:27px;font-weight:700;letter-spacing:-.8px;line-height:1.2}
.nwbig small{font-size:12px;font-weight:400;color:var(--sub);letter-spacing:0}
.nwsub{font-size:11px;color:var(--sub);margin-top:2px}
.nwgrid{display:flex;gap:8px;margin-bottom:4px}
.nwcell{flex:1;background:var(--inset);border:1px solid var(--line2);border-radius:11px;padding:8px 10px;min-width:0}
.nwcell .l{font-size:9.5px;color:var(--sub)}
.nwcell .v{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;margin-top:2px;white-space:nowrap}
.nwlist{margin-top:4px}
.nwr{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--line2)}
.nwr:last-child{border-bottom:none;padding-bottom:0}
.hsub{font-size:11px;color:var(--sub);margin-top:3px}
.ia{margin-top:8px;background:var(--inset);border:1px solid var(--line2);color:var(--txt);
 font:inherit;font-size:11.5px;font-weight:600;border-radius:9px;padding:6px 12px;cursor:pointer}
.ia:hover{border-color:var(--acc);color:var(--acc)}
.chn{margin-inline-start:auto;font-size:11px;font-weight:600;color:var(--sub);
 font-family:'JetBrains Mono',monospace}
.fixlist{margin-top:6px}
.fixr{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line2);font-size:13px}
.fixr:last-child{border-bottom:none}
.fixr.done{opacity:.5}
.fixr.done .rt{text-decoration:line-through}
.fixr .rmain{flex:1;min-width:0}
.fixr .rt{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fixr .ra{font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:600}
.fixr .okm{color:var(--grn);display:flex;width:30px;justify-content:center}
.fixr .okm svg{width:16px;height:16px}
.ib.go{color:var(--acc)}
.track{position:relative}
.soonbar{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,
 color-mix(in srgb,#4E8FB5 55%,transparent) 0 5px,transparent 5px 10px)}
.soon{font-style:normal;color:#4E8FB5;font-size:10px}

/* the one thing to do now */
.focus{display:flex;gap:13px;padding:15px;border-radius:15px;margin-bottom:12px;
 background:linear-gradient(145deg,color-mix(in srgb,var(--acc) 9%,var(--inset)),var(--inset));
 border:1px solid color-mix(in srgb,var(--acc) 26%,var(--line2))}
.focus.danger{background:linear-gradient(145deg,color-mix(in srgb,var(--red) 11%,var(--inset)),var(--inset));
 border-color:color-mix(in srgb,var(--red) 32%,var(--line2))}
.focus.warn{background:linear-gradient(145deg,color-mix(in srgb,var(--amb,#C98A4B) 11%,var(--inset)),var(--inset));
 border-color:color-mix(in srgb,var(--amb,#C98A4B) 30%,var(--line2))}
.focus.good{background:linear-gradient(145deg,color-mix(in srgb,var(--grn) 10%,var(--inset)),var(--inset));
 border-color:color-mix(in srgb,var(--grn) 28%,var(--line2))}
.fic{font-size:26px;line-height:1.1;flex:none}
.fbody{flex:1;min-width:0}
.ft{font-size:15px;font-weight:700;line-height:1.35;margin-bottom:4px}
.fb{font-size:12.5px;color:var(--sub);line-height:1.6}
.fa{margin-top:11px;display:inline-flex;align-items:center;gap:6px;background:var(--acc);
 color:var(--ink);border:none;font:inherit;font-size:12.5px;font-weight:700;
 border-radius:10px;padding:9px 15px;cursor:pointer}
.fa svg{width:13px;height:13px}
.focus.danger .fa{background:var(--red);color:#fff}

/* the rest, at a glance */
.inslist{display:flex;flex-direction:column;gap:2px}
.ins2{display:flex;align-items:flex-start;gap:11px;padding:12px 11px;border-radius:11px;
 border-inline-start:3px solid var(--line2);background:var(--inset)}
.ins2[onclick]{cursor:pointer}
.ins2[onclick]:hover{background:color-mix(in srgb,var(--acc) 7%,var(--inset))}
.ins2.danger{border-inline-start-color:var(--red)}
.ins2.warn{border-inline-start-color:#C98A4B}
.ins2.good{border-inline-start-color:var(--grn)}
.ins2 .ic{font-size:17px;flex:none;line-height:1.3}
.i2m{flex:1;min-width:0;display:block}
.i2m b{display:block;font-size:12.5px;font-weight:600;line-height:1.4}

function normalize(d){
 d.categories=d.categories||[];d.incomes=d.incomes||[];d.expenses=d.expenses||[];d.debts=d.debts||[];
 // Added in 1.1.0 — an older backup or an older device's cloud copy has none of these.
 d.gameyas=d.gameyas||[];d.savings=d.savings||[];d.invests=d.invests||[];
 d.fixed=d.fixed||[]; // 1.4.0
 const RM={cat_food:"c_food",cat_transport:"c_transport",cat_housing:"c_housing",cat_health:"c_health",
  cat_investment:"c_invest",cat_subscriptions:"c_subs",cat_entertainment:"c_fun",cat_shopping:"c_shop",
  cat_education:"c_edu",cat_family:"c_family",cat_other:"c_other"};
 d.categories.forEach(c=>{if(RM[c.id])c.id=RM[c.id]});
 d.expenses.forEach(e=>{if(RM[e.categoryId])e.categoryId=RM[e.categoryId]});
 const seen=new Set();
 d.categories=d.categories.filter(c=>seen.has(c.id)?false:(seen.add(c.id),true));
 DEF.forEach(c=>{if(!seen.has(c.id))d.categories.push(JSON.parse(JSON.stringify(c)))});
 d.categories.forEach(c=>{if(!c.emoji)c.emoji="🏷️"});
 return d;
}

function planOf(cs,income){
 const bt=cs.reduce((s,c)=>s+(Number(c.budget)||0),0);
 // Budgets that add up to more than income make every pace figure meaningless,
 // so the realistic ceiling is income.
 const plan=bt>0?(income>0?Math.min(bt,income):bt):income;
 return {bt,plan,unrealistic:income>0&&bt>income};
}
function payoff(bal,rate,pay){
 bal=Number(bal)||0;rate=Number(rate)||0;pay=Number(pay)||0;
 if(bal<=0)return{n:0,interest:0,ok:true};
 if(pay<=bal*rate)return{n:Infinity,interest:Infinity,ok:false};
 if(rate===0)return{n:Math.ceil(bal/pay),interest:0,ok:true};
 const n=Math.ceil(-Math.log(1-(bal*rate)/pay)/Math.log(1+rate));
 let b=bal,ti=0;for(let i=0;i<n&&i<600;i++){const it=b*rate;ti+=it;b=b+it-pay;if(b<0)b=0}
 return{n,interest:ti,ok:true}}

/* ============ Wallet maths ============ */
// Whole months from one YYYY-MM key to another; negative when the first is later.
function mDiff(a,b){const[y1,m1]=a.split("-").map(Number),[y2,m2]=b.split("-").map(Number);return (y2-y1)*12+(m2-m1)}
// A gameya is a fixed circle: everyone pays the same instalment every month, and each
// member takes the whole pot once. Before your turn the money you have put in is savings
// you will get back; after it, what is left to pay is a debt. net is that, asset-positive.
function gamOf(g){
 const members=Math.max(1,Math.round(Number(g.members)||1));
 const amt=Number(g.amount)||0;
 const turn=Math.min(members,Math.max(1,Math.round(Number(g.turn)||1)));
 const start=g.start||mKey();
 const elapsed=mDiff(start,mKey());
 const paidN=Math.max(0,Math.min(members,elapsed+1));
 const leftN=members-paidN;
 const turnIn=(turn-1)-elapsed;
 return{members,amt,turn,start,paidN,leftN,
  paid:amt*paidN,
  // What you still owe the circle. This is the number that belongs in your debts:
  // the instalments are due whether or not you have taken your payout yet.
  owed:amt*leftN,
  payout:amt*members,
  turnIn,took:turnIn<0,done:leftN<=0,
  // Only true once he confirms the money landed and it has been moved to a goal.
  banked:!!g.banked};
}
function savOf(s){
 const target=Number(s.target)||0,now=Number(s.saved)||0,per=Number(s.monthly)||0;
 const left=Math.max(0,target-now);
 return{target,now,per,left,pct:target>0?Math.min(100,(now/target)*100):0,
  months:left>0?(per>0?Math.ceil(left/per):null):0,done:target>0&&now>=target};
}
function invOf(i){
 const put=Number(i.amount)||0,now=Number(i.value)||0,diff=now-put;
 return{put,now,diff,pct:put>0?(diff/put)*100:0,liquid:i.liquid!==false};
}
// Average monthly spend over the last 3 months that have any, so the emergency-fund
// figure doesn't swing on a quiet month.
function avgSpend(){
 const by={};
 (st.data.expenses||[]).forEach(e=>{by[e.month]=(by[e.month]||0)+(Number(e.amount)||0)});
 const ms=Object.keys(by).sort().slice(-3);
 if(!ms.length)return 0;
 return ms.reduce((s,m)=>s+by[m],0)/ms.length;
}
function netWorth(){
 const d=st.data;
 const debts=(d.debts||[]).reduce((s,x)=>s+(Number(x.balance)||0),0);
 // A gameya is a commitment, not a holding: what is left to pay is a debt, and the
 // payout only becomes money once it is collected and put into a goal.
 const gamOwed=(d.gameyas||[]).reduce((s,g)=>s+gamOf(g).owed,0);
 const gamMonthly=(d.gameyas||[]).reduce((s,g)=>{const o=gamOf(g);return s+(o.done?0:o.amt)},0);
 const sav=(d.savings||[]).reduce((s,x)=>s+(Number(x.saved)||0),0);
 const inv=(d.invests||[]).reduce((s,x)=>s+(Number(x.value)||0),0);
 const liquid=(d.invests||[]).reduce((s,x)=>s+(invOf(x).liquid?invOf(x).now:0),0);
 const debtMonthly=(d.debts||[]).reduce((s,x)=>s+(Number(x.monthlyPay)||0),0);
 const savMonthly=(d.savings||[]).reduce((s,x)=>s+(savOf(x).done?0:Number(x.monthly)||0),0);
 const assets=sav+inv,liab=debts+gamOwed;
 const spend=avgSpend();
 return{debts,gamOwed,gamMonthly,sav,inv,liquid,debtMonthly,savMonthly,
  monthly:debtMonthly+gamMonthly+savMonthly,
  assets,liab,net:assets-liab,
  coverMonths:spend>0?liquid/spend:null,
  any:debts>0||gamOwed>0||sav>0||inv>0};
}
/* ============ The pay cycle ============
 * A salary that lands on the 25th makes the 1st of the month meaningless: on the
 * 24th you are broke and on the 26th you are rich, and a calendar month says both
 * are the same. Once a salary is logged, every "what can I spend" figure runs from
 * payday to the day before the next one. */
function salaryDay(){
 const s=(st.data.incomes||[]).filter(i=>i.salary)
  .sort((a,b)=>txD(b).localeCompare(txD(a)))[0];
 return s?Number(txD(s).slice(8,10))||0:0;
}
function cycle(){
 const pd=salaryDay(),today=new Date(),isCur=st.month===mKey();
 if(!pd||!isCur){
  const dim=dIn(st.month);
  const day=isCur?Math.min(dim,today.getDate()):dim;
  return{pay:0,start:st.month+"-01",end:st.month+"-"+String(dim).padStart(2,"0"),
   daysTotal:dim,daysIn:day,daysLeft:Math.max(1,dim-day+1),isCur};
 }
 const clamp=(y,m,d)=>{const last=new Date(y,m+1,0).getDate();return new Date(y,m,Math.min(d,last))};
 const y=today.getFullYear(),m=today.getMonth();
 const start=today.getDate()>=pd?clamp(y,m,pd):clamp(y,m-1,pd);
 const nextPay=clamp(start.getFullYear(),start.getMonth()+1,pd);
 const end=new Date(nextPay);end.setDate(end.getDate()-1);
 const dayMs=86400000;
 const mid=d=>Date.UTC(d.getFullYear(),d.getMonth(),d.getDate());
 return{pay:pd,start:dKey(start),end:dKey(end),
  daysTotal:Math.round((mid(end)-mid(start))/dayMs)+1,
  daysIn:Math.round((mid(today)-mid(start))/dayMs)+1,
  daysLeft:Math.max(1,Math.round((mid(end)-mid(today))/dayMs)+1),isCur:true};
}
const inCyc=(x,C)=>{const d=txD(x);return d>=C.start&&d<=C.end};
const cycInc=C=>(st.data.incomes||[]).filter(i=>inCyc(i,C));
const cycEx=C=>(st.data.expenses||[]).filter(e=>inCyc(e,C));

/* ============ What each category is for ============
 * The 50/30/20 split only means something if the app knows which spending is a
 * need and which is a want. These are defaults; each one is changeable. */
const KIND={c_food:"n",c_transport:"n",c_housing:"n",c_health:"n",c_edu:"n",c_family:"n",
 c_fun:"w",c_shop:"w",c_subs:"w",c_other:"w",c_invest:"s",c_savings:"s",c_debt:"d"};
function kindOf(c){return (c&&c.kind)||KIND[c&&c.id]||"w"}

/* ============ The plan ============
 * Income is handed out in order: what must be paid, then what is owed, then what
 * is put away, and only what survives all three is free to live on. */
function mPlan(){
 const C=cycle(),useC=C.pay>0&&C.isCur;
 const inc=useC?sum(cycInc(C)):sum(incOf());
 const ex=useC?cycEx(C):expOf();
 const F=fixedTotals();
 const gamMonthly=(st.data.gameyas||[]).reduce((s,g)=>{const o=gamOf(g);return s+(o.done?0:o.amt)},0);
 const fixOnly=Math.max(0,F.total-gamMonthly);
 const debtPay=(st.data.debts||[]).reduce((s,d)=>s+(Number(d.monthlyPay)||0),0);
 const savTarget=(st.data.savings||[]).reduce((s,x)=>s+(savOf(x).done?0:Number(x.monthly)||0),0);
 const committed=F.total+debtPay+savTarget;
 const living=inc-committed;

 // Spending that is genuinely day-to-day: commitments already logged are not it.
 const live=ex.filter(e=>{const c=byId(e.categoryId);const k=kindOf(c);
  return !e.fixedId&&k!=="s"&&k!=="d"});
 const spent=k=>live.filter(e=>kindOf(byId(e.categoryId))===k).reduce((s,e)=>s+(Number(e.amount)||0),0);
 const needS=spent("n"),wantS=spent("w"),liveS=needS+wantS;

 // Needs take the larger share of what is left, because they are not optional.
 const needB=Math.max(0,living*.65),wantB=Math.max(0,living*.35);
 const free=living-liveS;

 // 50/30/20 is checked against the plan, not against spending so far: on day 3 of
 // the cycle nobody has spent their month's wants yet, and a bar that says so is
 // telling you about the date, not about your money.
 const r={need:fixOnly+needB,want:wantB,save:savTarget+debtPay+gamMonthly};
 const rp=k=>inc>0?(r[k]/inc)*100:0;

 return{C,useC,inc,fixTotal:F.total,fixOnly,gamMonthly,debtPay,savTarget,committed,living,
  needS,wantS,liveS,needB,wantB,free,
  perDay:C.daysLeft>0?free/C.daysLeft:free,
  rule:{need:rp("need"),want:rp("want"),save:rp("save"),
   needAmt:r.need,wantAmt:r.want,saveAmt:r.save},
  ok:living>=0};
}
// Which debt to attack first and what it buys: highest rate, because that is the
// one charging the most for the delay.
function debtPlan(){
 const ds=(st.data.debts||[]).filter(d=>Number(d.balance)>0);
 if(!ds.length)return null;
 const rows=ds.map(d=>{
  const r=payoff(d.balance,(Number(d.rate)||0)/100,d.monthlyPay);
  return{d,r,end:r.ok&&isFinite(r.n)?mSft(mKey(),r.n):null};
 }).sort((a,b)=>(Number(b.d.rate)||0)-(Number(a.d.rate)||0));
 const first=rows[0];
 const boost=first?payoff(first.d.balance,(Number(first.d.rate)||0)/100,(Number(first.d.monthlyPay)||0)+500):null;
 return{rows,first,boost,
  total:ds.reduce((s,d)=>s+Number(d.balance||0),0),
  monthly:ds.reduce((s,d)=>s+(Number(d.monthlyPay)||0),0)};
}

function guess(text,kind){
 const s=(text||"").trim().toLowerCase();if(!s)return{};
 const has=a=>a.some(w=>s.includes(w.toLowerCase()));
 if(kind==="i")return has(KW.sal)?{salary:true}:{};
 const out={};
 // A gameya named in the text beats the generic word; with one gameya running,
 // the generic word is unambiguous anyway.
 const g=(st.data.gameyas||[]).find(x=>x.name&&s.includes(String(x.name).toLowerCase()));
 if(g)out.gamId=g.id;
 else if(has(KW.gam)){const act=(st.data.gameyas||[]).filter(x=>!gamOf(x).done);
  if(act.length===1)out.gamId=act[0].id}
 const f=(st.data.fixed||[]).find(x=>x.name&&s.includes(String(x.name).toLowerCase()));
 if(f)out.fixedId=f.id;
 if(!out.gamId&&!out.fixedId)for(const k in CATKW)if(has(CATKW[k])){out.catId=k;break}
 return out;
}

/* ============ Fixed commitments & the daily number ============
 * Everything that leaves the income whatever happens — rent, internet, a debt
 * payment, a gameya instalment — is reserved before any "you can spend X" figure
 * is shown. A budget that ignores them lies to you on the 3rd of the month. */
function fixedList(){
 const own=(st.data.fixed||[]).filter(f=>f.active!==false)
  .map(f=>({id:f.id,name:f.name,amount:Number(f.amount)||0,emoji:f.emoji||"📌",
   categoryId:f.categoryId||"c_bills",own:true}));
 // A gameya instalment is a fixed commitment by nature, so it appears here too
 // rather than being something to remember separately.
 const gam=(st.data.gameyas||[]).filter(g=>!gamOf(g).done)
  .map(g=>({id:"gam:"+g.id,name:g.name,amount:gamOf(g).amt,emoji:"🤝",
   categoryId:"c_savings",own:false}));
 return own.concat(gam);
}
function fixedOf(m){
 m=m||st.month;
 const C=cycle();
 const ex=(C.pay>0&&C.isCur&&m===st.month)?cycEx(C):expOf(m);
 return fixedList().map(f=>{
  const hit=ex.find(e=>e.fixedId===f.id);
  return Object.assign({},f,{paid:!!hit,paidAmount:hit?Number(hit.amount)||0:0,expId:hit?hit.id:null});
 });
}
function fixedTotals(m){
 const list=fixedOf(m);
 return{list,
  total:list.reduce((s,f)=>s+f.amount,0),
  paid:list.filter(f=>f.paid).reduce((s,f)=>s+f.paidAmount,0),
  due:list.filter(f=>!f.paid).reduce((s,f)=>s+f.amount,0),
  dueCount:list.filter(f=>!f.paid).length};
}
// What is actually free to spend, per remaining day, with today's spending
// measured against today's share rather than buried in the month's total.
function daily(){
 const C=cycle(),isCur=C.isCur,useC=C.pay>0&&isCur;
 const inc=useC?sum(cycInc(C)):sum(incOf());
 const rows=useC?cycEx(C):expOf();
 const exAll=sum(rows);
 const today=isCur?rows.filter(e=>txD(e)===dKey()).reduce((s,e)=>s+Number(e.amount||0),0):0;
 const due=fixedTotals().due;
 const daysLeft=C.daysLeft;
 const potStart=inc-(exAll-today)-due;
 const perDay=potStart/daysLeft;
 return{inc,exAll,today,due,daysLeft,day:C.daysIn,dim:C.daysTotal,isCur,useC,C,perDay,
  leftToday:perDay-today,pot:potStart-today};
}
// Days with something logged that stayed inside the daily share, counting back from
// yesterday — today is still in progress, so a streak you can still lose isn't one.
// A day with nothing logged is no evidence of restraint, so it neither counts nor
// breaks the run; counting empty days would turn "I forgot to log" into a streak.
function streak(){
 const d=daily();if(!(d.perDay>0))return 0;
 const by={};(st.data.expenses||[]).forEach(e=>{const k=txD(e);by[k]=(by[k]||0)+(Number(e.amount)||0)});
 const first=Object.keys(by).sort()[0];if(!first)return 0;
 let n=0;const now=new Date();
 for(let i=1;i<=90;i++){
  const dt=new Date(now);dt.setDate(now.getDate()-i);
  const k=dKey(dt);
  if(k<first)break;
  if(by[k]===undefined)continue;
  if(by[k]<=d.perDay)n++;else break;
 }
 return n;
}
// A category well above its own recent normal — the thing worth knowing before
// the month ends, as opposed to a budget it was never given.
function spikes(){
 const m=st.month,prev=[mSft(m,-1),mSft(m,-2),mSft(m,-3)];
 const now=catSpend(m);
 return now.map(c=>{
  const hist=prev.map(p=>(expOf(p).filter(e=>e.categoryId===c.id)
   .reduce((s,e)=>s+Number(e.amount||0),0)));
  const seen=hist.filter(v=>v>0);
  if(seen.length<2||c.spent<=0)return null;
  const avg=seen.reduce((a,b)=>a+b,0)/seen.length;
  const d=((c.spent-avg)/avg)*100;
  return d>=40&&c.spent-avg>=100?{c,avg,d:Math.round(d),extra:c.spent-avg}:null;
 }).filter(Boolean).sort((a,b)=>b.extra-a.extra);
}
// Same category, close to the same amount, two months running: that is a
// subscription or a bill, and it belongs in the fixed list.
function recurringHints(){
 const m=st.month,p1=mSft(m,-1),p2=mSft(m,-2);
 const known=new Set(fixedList().map(f=>f.categoryId+"|"+Math.round(f.amount/50)));
 const groups={};
 [m,p1,p2].forEach(mm=>{
  expOf(mm).forEach(e=>{
   const k=e.categoryId+"|"+Math.round(Number(e.amount||0)/50);
   (groups[k]=groups[k]||{months:new Set(),amt:Number(e.amount)||0,cat:e.categoryId}).months.add(mm);
  });
 });
 return Object.keys(groups).filter(k=>groups[k].months.size>=2&&!known.has(k)&&groups[k].amt>=100)
  .map(k=>groups[k]).sort((a,b)=>b.amt-a.amt).slice(0,1);
}

/* ============ Insights ============ */
function insights(){
 const out=[],cur=st.currency,now=new Date(),isCur=st.month===mKey();
 const exAll=expOf(),inc=incOf(),tI=sum(inc);
 // Money moved into savings or onto a debt is not spending; letting it compete for
 // "biggest expense" buries the real one and scolds you for doing the right thing.
 const ex=exAll.filter(e=>{const k=kindOf(byId(e.categoryId));return k!=="s"&&k!=="d"});
 const tE=sum(ex);
 const dim=dIn(st.month),day=isCur?now.getDate():dim;
 const csAll=catSpend(),P=planOf(csAll,tI),plan=P.plan;
 const cs=csAll.filter(c=>{const k=kindOf(c);return k!=="s"&&k!=="d"});

 const D=daily(),F=fixedTotals();

 // Unlogged fixed commitments make every other number optimistic, so this leads.
 if(isCur&&F.dueCount>0)out.push({lv:"warn",ic:"📌",t:t("iFixT",F.dueCount),
  b:t("iFixB",fmt(F.due),cur),a:{l:t("iFixA"),f:"go('home');setTimeout(()=>{const e=document.querySelector('.fixlist');if(e)e.scrollIntoView({behavior:'smooth',block:'center'})},120)"}});

 if(isCur&&D.perDay>0){
  const over=D.today>D.perDay;
  out.push({lv:over?"warn":"good",ic:over?"🫰":"🟢",
   t:over?t("iDayOverT",fmt(D.today-D.perDay),cur):t("iDayOkT",fmt(Math.max(0,D.leftToday)),cur),
   b:t("iDayB",fmt(D.perDay),cur,D.daysLeft),a:{l:t("aLog"),f:"st.cf=null;go('log')"}});
 }
 if(isCur){const sk=streak();
  if(sk>=3)out.push({lv:"good",ic:"🔥",t:t("iStreakT",sk),b:t("iStreakB"),a:{l:t("aLog"),f:"st.cf=null;go('log')"}});}

 spikes().filter(sp=>{const k=kindOf(sp.c);return k!=='s'&&k!=='d'}).slice(0,2).forEach(sp=>out.push({lv:"warn",ic:sp.c.emoji,
  t:t("iSpikeT",cNm(sp.c),sp.d),b:t("iSpikeB",fmt(sp.c.spent),fmt(Math.round(sp.avg)),cur,fmt(Math.round(sp.extra))),a:{l:t("aCat"),f:`seeCat('${sp.c.id}')`}}));

 recurringHints().forEach(h=>{const c=byId(h.cat);if(!c)return;
  out.push({lv:"info",ic:"🔁",t:t("iRecT",cNm(c),fmt(h.amt),cur),b:t("iRecB"),
   a:{l:t("iRecA"),f:`addFixedFrom('${h.cat}',${h.amt})`}})});

 (st.data.gameyas||[]).forEach(g=>{const o=gamOf(g);
  if(o.turnIn===0&&!o.banked)out.push({lv:"good",ic:"🎉",t:t("iGamT",esc(g.name)),
   b:t("iGamB",fmt(o.payout),cur),a:{l:t("iGamA"),f:`bankGam('${g.id}')`}});
  else if(o.turnIn===1)out.push({lv:"info",ic:"📆",t:t("iGamNextT",esc(g.name)),b:t("iGamNextB",fmt(o.payout),cur),a:{l:t("aGam"),f:"go('debt');setW('sav')"}})});

 (st.data.savings||[]).forEach(sv=>{const o=savOf(sv);
  const feed=(st.data.gameyas||[]).filter(g=>g.goalId===sv.id&&!gamOf(g).banked);
  if(!feed.length||o.done)return;
  const add=feed.reduce((a,g)=>a+gamOf(g).payout,0);
  const after=o.now+add;
  if(after>=o.target)out.push({lv:"good",ic:"🤝",t:t("iGoalHitT",esc(sv.name)),
   b:t("iGoalHitB",esc(feed[0].name),fmt(add),cur),a:{l:t("aSav"),f:"go('debt');setW('sav')"}});});

 const NW=netWorth();
 if(NW.liquid>0&&NW.coverMonths!==null&&NW.coverMonths<3)
  out.push({lv:"warn",ic:"🛟",t:t("iEmT",Math.max(0,Math.floor(NW.coverMonths))),b:t("iEmB",fmt(Math.round(avgSpend()*3-NW.liquid)),cur),a:{l:t("aInv"),f:"go('debt');setW('inv')"}});

 if(isCur){
  const td=dKey(now),ts=ex.filter(e=>txD(e)===td).reduce((s,e)=>s+Number(e.amount||0),0);
  const past=ex.filter(e=>txD(e)<td),ds=new Set(past.map(txD));
  const avg=ds.size?past.reduce((s,e)=>s+Number(e.amount||0),0)/ds.size:0;
  if(ts>0&&avg>0){const d=((ts-avg)/avg)*100;
   if(d>=50)out.push({lv:"danger",ic:"🔥",t:t("iSpentToday",fmt(ts),cur),b:t("iAboveAvg",fmt(avg),Math.round(d)),a:{l:t("aLog"),f:"st.cf=null;go('log')"}});
   else if(d<=-40)out.push({lv:"good",ic:"👏",t:t("iFrugalT",fmt(ts),cur),b:t("iFrugalB",Math.round(-d)),a:{l:t("aLog"),f:"st.cf=null;go('log')"}});
   else out.push({lv:"info",ic:"📅",t:t("iSpentToday",fmt(ts),cur),b:t("iNormalB",fmt(avg)),a:{l:t("aLog"),f:"st.cf=null;go('log')"}});
  }else if(ts===0&&day>1)out.push({lv:"good",ic:"✨",t:t("iZeroT"),b:t("iZeroB")});
 }
 if(plan>0&&day>2&&tE>0){const pr=(tE/day)*dim;
  if(pr>plan*1.1)out.push({lv:"danger",ic:"📈",t:t("iPaceBadT",fmt(pr),cur),
   b:t("iPaceBadB",fmt(plan),fmt(pr-plan),fmt((pr-plan)/Math.max(1,dim-day))),a:{l:t("aRep"),f:"go('rep')"}});
  else if(pr<plan*.85)out.push({lv:"good",ic:"🎯",t:t("iPaceGoodT"),b:t("iPaceGoodB",fmt(pr),fmt(plan),fmt(plan-pr)),a:{l:t("aRep"),f:"go('rep')"}});
 }
 // The per-day figure lives in the hero now; only the blown-budget case is news.
 if(plan>0&&isCur&&day<dim&&plan-tE<=0)
  out.push({lv:"danger",ic:"⛔",t:t("iBustT"),b:t("iBustB",fmt(tE-plan),cur,dim-day+1),a:{l:t("aRep"),f:"go('rep')"}});
 const over=cs.filter(c=>c.budget>0&&c.spent>c.budget).sort((a,b)=>(b.spent-b.budget)-(a.spent-a.budget));
 const near=cs.filter(c=>c.budget>0&&c.spent<=c.budget&&c.pct>=80);
 if(over.length)out.push({lv:"danger",ic:"⚠️",t:t("iOverT",plN(over.length,"cat")),
  b:over.slice(0,3).map(c=>`${c.emoji} ${cNm(c)}: ${fmt(c.spent)} / ${fmt(c.budget)}`).join(" · "),
  a:{l:t("iOverA"),f:"go('rep')"}});
 if(near.length)out.push({lv:"warn",ic:"🔔",t:t("iNearT",plN(near.length,"cat")),
  b:near.slice(0,3).map(c=>`${c.emoji} ${cNm(c)}: ${Math.round(c.pct)}%`).join(" · "),a:{l:t("aRep"),f:"go('rep')"}});
 const top=cs.filter(c=>c.spent>0).sort((a,b)=>b.spent-a.spent)[0];
 if(top&&tE>0){const sh=Math.round((top.spent/tE)*100);
  out.push({lv:sh>45?"warn":"info",ic:top.emoji,t:t("iTopT",cNm(top),fmt(top.spent),cur),b:t("iTopB",sh,sh>45),a:{l:t("aCat"),f:`seeCat('${top.id}')`}})}
 const big=[...ex].sort((a,b)=>b.amount-a.amount)[0];
 if(big&&tE>0&&big.amount>tE*.25){const c=byId(big.categoryId);
  const meta=`${c?c.emoji+" "+cNm(c):""}${big.note?" — "+big.note:""}`;
  out.push({lv:"info",ic:"💸",t:t("iBigT",fmt(big.amount),cur),b:t("iBigB",meta,Math.round(big.amount/tE*100)),a:{l:t("aLog"),f:`seeCat('${big.categoryId}')`}})}
 const pm=mSft(st.month,-1),pe=sum(expOf(pm));
 if(pe>0&&tE>0){const d=((tE-pe)/pe)*100;
  if(Math.abs(d)>=12)out.push({lv:d>0?"warn":"good",ic:d>0?"⬆️":"⬇️",
   t:t("iVsT",d>0,mLab(pm),Math.abs(Math.round(d))),b:t("iVsB",fmt(tE),fmt(pe),cur),a:{l:t("aRep"),f:"go('rep')"}})}
 const pcs=catSpend(pm),drop=pcs.filter(p=>p.spent>0&&!cs.find(c=>c.id===p.id&&c.spent>0));
 if(drop.length)out.push({lv:"good",ic:"🚫",t:t("iDropT",plN(drop.length,"item")),
  b:drop.slice(0,4).map(c=>`${c.emoji} ${cNm(c)} ${t("iWas",fmt(c.spent))}`).join(" · "),a:{l:t("aRep"),f:"go('rep')"}});
 if(tI>0){const r=((tI-tE)/tI)*100;
  if(r<0)out.push({lv:"danger",ic:"🩸",t:t("iDefT"),b:t("iDefB",fmt(tE-tI),cur),a:{l:t("aRep"),f:"go('rep')"}});
  else if(r>=25)out.push({lv:"good",ic:"🏆",t:t("iSaveHiT",Math.round(r)),b:t("iSaveHiB",fmt(tI-tE),cur),a:{l:t("aSav"),f:"go('debt');setW('sav')"}});
  else if(r<10)out.push({lv:"warn",ic:"📉",t:t("iSaveLoT",Math.round(r)),b:t("iSaveLoB",fmt(tI-tE),cur),a:{l:t("aSav"),f:"go('debt');setW('sav')"}})}
 if(P.unrealistic)out.push({lv:"warn",ic:"🧾",t:t("iBudT"),b:t("iBudB",fmt(P.bt),fmt(tI),cur,fmt(P.bt-tI)),a:{l:t("aBud"),f:"go('set')"}});
 const ds2=st.data.debts||[];
 if(ds2.length){const tb=ds2.reduce((s,d)=>s+Number(d.balance||0),0);
  const w=ds2.map(d=>({...d,r:payoff(d.balance,(Number(d.rate)||0)/100,d.monthlyPay)}))
   .sort((a,b)=>(Number(b.rate)||0)-(Number(a.rate)||0))[0];
  if(w&&!w.r.ok)out.push({lv:"danger",ic:"🆘",t:t("iDebtUpT",w.name),b:t("iDebtUpB"),a:{l:t("aDebt"),f:"go('debt');setW('debt')"}});
  else if(w&&isFinite(w.r.n)&&w.r.n>0)out.push({lv:"info",ic:"💳",t:t("iDebtT",fmt(tb),cur),
   b:t("iDebtB",w.name,w.r.n,fmt(w.r.interest)),a:{l:t("aDebt"),f:"go('debt');setW('debt')"}})}
 const ord={danger:0,warn:1,good:2,info:3};
 return out.sort((a,b)=>ord[a.lv]-ord[b.lv]);
}

/* ============ Charts ============ */
function ring(pct,over){
 const R=36,C=2*Math.PI*R,p=Math.max(0,Math.min(100,pct));
 return `<div class="ring"><svg width="84" height="84" viewBox="0 0 84 84">
 <circle cx="42" cy="42" r="${R}" fill="none" stroke="var(--inset)" stroke-width="7"/>
 <circle cx="42" cy="42" r="${R}" fill="none" stroke="${over?"var(--red)":"var(--acc)"}" stroke-width="7"
  stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p/100)}"
  style="transition:stroke-dashoffset .6s cubic-bezier(.3,.8,.3,1)"/></svg>
 <div class="ringtx"><b style="color:${over?"var(--red)":"var(--text)"}">${Math.round(pct)}%</b><i>${t("used")}</i></div></div>`;
}
function donut(items,w=230,h=230){
 const tot=items.reduce((s,d)=>s+d.value,0);if(!tot)return"";
 const cx=w/2,cy=h/2,R=88,r=55;let a=-90,o="";
 items.forEach(d=>{const sw=(d.value/tot)*360,big=sw>180?1:0;
  const s=a*Math.PI/180,e=(a+sw)*Math.PI/180;
  const x1=cx+R*Math.cos(s),y1=cy+R*Math.sin(s),x2=cx+R*Math.cos(e),y2=cy+R*Math.sin(e);
  const i1=cx+r*Math.cos(s),j1=cy+r*Math.sin(s),i2=cx+r*Math.cos(e),j2=cy+r*Math.sin(e);
  o+=`<path d="M${x1},${y1} A${R},${R} 0 ${big} 1 ${x2},${y2} L${i2},${j2} A${r},${r} 0 ${big} 0 ${i1},${j1} Z" fill="${d.color}" stroke="var(--pa)" stroke-width="2.5"/>`;
  a+=sw});
 return `<svg class="c2" viewBox="0 0 ${w} ${h}" style="max-width:230px;margin:0 auto">${o}
 <text x="${cx}" y="${cy+6}" text-anchor="middle" fill="var(--text)" font-size="18" font-weight="700" font-family="JetBrains Mono">${fmt(tot)}</text></svg>`}
function bars(d,w=560,h=215){
 const p={l:38,r:10,t:10,b:24},iw=w-p.l-p.r,ih=h-p.t-p.b;
 const mx=Math.max(1,...d.map(x=>Math.max(x.income,x.expense)));
 const gw=iw/d.length,bw=gw*.3;let o="";
 d.forEach((x,i)=>{const gx=p.l+i*gw+gw*.16,hi=(x.income/mx)*ih,he=(x.expense/mx)*ih;
  o+=`<rect x="${gx}" y="${p.t+ih-hi}" width="${bw}" height="${hi}" rx="4" fill="var(--grn)"/>`;
  o+=`<rect x="${gx+bw+4}" y="${p.t+ih-he}" width="${bw}" height="${he}" rx="4" fill="var(--red)"/>`});
 const g=[0,.5,1].map(f=>`<line x1="${p.l}" y1="${p.t+ih*(1-f)}" x2="${w-p.r}" y2="${p.t+ih*(1-f)}" stroke="var(--line)" stroke-dasharray="3,4"/>`).join("");
 const l=d.map((x,i)=>`<text x="${p.l+i*gw+gw/2}" y="${h-5}" fill="var(--sub)" font-size="11" text-anchor="middle" font-family="IBM Plex Sans Arabic">${x.label}</text>`).join("");
 return `<svg class="c2" viewBox="0 0 ${w} ${h}">${g}${o}${l}</svg>`}

 ad.kind=kind;ad.editId=id;ad.allCats=false;ad.g={};ad.touchedCat=true;ad.amount=String(r.amount||"");ad.note=r.note||"";

 const cats=freqCats(),cur=esc(st.currency),rec=combos(),amt=ad.amount||"0";

 document.getElementById("sheetHost").innerHTML=`
 <div class="scrim" id="scrim" onclick="closeAdd()"></div>

  ${ad.kind==="e"?(()=>{const show=ad.allCats?cats:cats.slice(0,6);

/* The app reads what you type. "قبض" files the salary and starts the cycle there;
 * a gameya's name files that instalment — no second trip to another screen. */
function hintHTML(){
 const g=ad.g||{};
 if(g.salary)return `<span class="gh ok">✓ ${t("hSalary")}</span>`;
 if(g.gamId){const x=(st.data.gameyas||[]).find(y=>y.id===g.gamId);
  if(x)return `<span class="gh ok">✓ ${t("hGam",esc(x.name),fmt(gamOf(x).amt))}</span>`}
 if(g.fixedId){const f=(st.data.fixed||[]).find(y=>y.id===g.fixedId);
  if(f)return `<span class="gh ok">✓ ${t("hFix",esc(f.name))}</span>`}
 if(g.catId){const c=byId(g.catId);
  if(c)return `<span class="gh">${c.emoji} ${t("hCat",esc(cNm(c)))}</span>`}
 return "";
}
function typed(v){
 if(ad.kind==="i")ad.source=v;else ad.note=v;
 const g=guess(v,ad.kind);
 const was=JSON.stringify(ad.g||{});
 ad.g=g;
 // A guessed category selects itself, but never over a category you picked.
 if(g.catId&&!ad.touchedCat&&ad.cat!==g.catId){ad.cat=g.catId;
  document.querySelectorAll("#sheet .chip").forEach(el=>{
   el.classList.toggle("on",el.getAttribute("onclick")===`pickC('${g.catId}')`)})}
 if(JSON.stringify(g)!==was){const h=document.getElementById("ghint");if(h)h.innerHTML=hintHTML()}
}
function moreCats(){ad.allCats=true;sheet()}
function setKind(k){ad.kind=k;sheet()}
function pickC(id){ad.cat=id;ad.touchedCat=true;
 document.querySelectorAll("#sheet .chip").forEach(el=>el.classList.remove("on"));
 const b=[...document.querySelectorAll("#sheet .chip")].find(el=>el.getAttribute("onclick")===`pickC('${id}')`);
 if(b)b.classList.add("on")}
function useC(c,a){ad.cat=c;ad.amount=String(a);sheet()}
function kp(v){
 const had=!!ad.amount;
 if(v==="del")ad.amount=ad.amount.slice(0,-1);
 else{if(ad.amount.length>9)return;ad.amount=(ad.amount==="0"?"":ad.amount)+v}
 const el=document.querySelector(".amt .v");if(el)el.textContent=ad.amount||"0";
 if(!had&&ad.amount)sheet(); // hide quick chips once typing starts
}
function saveTx(){
 const amount=Number(ad.amount);
 if(!(amount>0)){toast(t("needAmt"),1);return}
 const date=ad.date||dKey(),month=date.slice(0,7);
 if(ad.kind==="i"){
  const src=(ad.source||"").trim()||t("income");
  if(ad.editId){const r=st.data.incomes.find(x=>x.id===ad.editId);
   if(r){r.amount=amount;r.source=src;r.date=date;r.month=month}toast(t("upd"))}
  else{const sal=!!(ad.g&&ad.g.salary);
   st.data.incomes.push({id:uid("inc"),month,date,source:src,amount,salary:sal,createdAt:Date.now()});
   toast(sal?t("svSal",date.slice(8,10)):t("svI"))}
 }else{
  if(!ad.cat){toast(t("needCat"),1);return}
  if(ad.editId){const r=st.data.expenses.find(x=>x.id===ad.editId);
   if(r){r.amount=amount;r.categoryId=ad.cat;r.note=(ad.note||"").trim();r.date=date;r.month=month}toast(t("upd"))}
  else{
   const g=ad.g||{};
   const fid=g.gamId?"gam:"+g.gamId:(g.fixedId||null);
   const taken=fid&&fixedOf().some(f=>f.id===fid&&f.paid);
   st.data.expenses.push({id:uid("exp"),month,date,categoryId:ad.cat,amount,
    note:(ad.note||"").trim(),fixedId:taken?null:fid,createdAt:Date.now()});
   const c=byId(ad.cat);
   const sp=st.data.expenses.filter(e=>e.month===month&&e.categoryId===ad.cat).reduce((s,e)=>s+Number(e.amount||0),0);
   if(c&&c.budget>0&&sp>c.budget)toast(t("ovr",cNm(c)),1);else toast(t("sv"));
  }}
 save();closeAdd();if(month!==st.month)st.month=month;
 setTimeout(()=>render(),250)}

 const o=cfg.arr().find(x=>x.id===id);if(!o)return;
 const fld=f=>{const v=o[f.k],fid="ef_"+f.k;
  if(f.t==="bool")return `<label class="chk"><input type="checkbox" id="${fid}"${v!==false?" checked":""}><span>${t(f.l)}</span></label>`;
  if(f.t==="emoji")return `<div class="fld"><label class="fl">${t("icon")}</label><select id="${fid}">${EMO.map(e=>`<option value="${e}"${e===v?" selected":""}>${e}</option>`).join("")}</select></div>`;
  if(f.t==="goal")return `<div class="fld"><label class="fl">${t(f.l)}</label><select id="${fid}"><option value="">${t("noGoal")}</option>${(st.data.savings||[]).map(x=>`<option value="${x.id}"${x.id===v?" selected":""}>${esc(x.name)}</option>`).join("")}</select></div>`;
  const ty=f.t==="month"?"month":f.t==="text"?"text":"number";
  return `<div class="fld"><label class="fl">${t(f.l)}</label><input id="${fid}" type="${ty}"${ty==="number"?' inputmode="decimal" step="any"':""} value="${esc(String(v==null?"":v))}"></div>`};
 modal(`<div class="stitle"><span>${cfg.ico} ${t("edit")}</span><button class="xb" onclick="closeModal()">${I.x}</button></div>
  ${cfg.f.map(fld).join("")}
  <button class="btn" onclick="saveEnt('${kind}','${id}')">${I.ok}${t("saveEdit")}</button>`)}
function saveEnt(kind,id){
 const cfg=ENT[kind];if(!cfg)return;
 const o=cfg.arr().find(x=>x.id===id);if(!o)return;
 cfg.f.forEach(f=>{const el=document.getElementById("ef_"+f.k);if(!el)return;
  if(f.t==="bool")o[f.k]=el.checked;
  else if(f.t==="num")o[f.k]=Number(el.value)||0;
  else if(f.t==="int")o[f.k]=Math.max(1,Math.round(Number(el.value)||1));
  else o[f.k]=el.value});
 if(kind==="gam")o.turn=Math.min(o.members,Math.max(1,o.turn));
 save();closeModal();paint();toast(t("upd"))}
// Collecting a gameya turns the pot into real money, so it lands in the goal it was for.
function bankGam(id){
 const g=(st.data.gameyas||[]).find(x=>x.id===id);if(!g)return;
 const goal=(st.data.savings||[]).find(x=>x.id===g.goalId);
 if(!goal){toast(t("gamNoGoal"),1);editEnt("gam",id);return}
 const o=gamOf(g);
 goal.saved=(Number(goal.saved)||0)+o.payout;
 g.banked=true;save();paint();
 toast(t("movedToGoal",fmt(o.payout)+" "+st.currency))}

// One tap turns a due commitment into a real expense, tagged so it is not asked for twice.
function logFixed(id){

function setTheme(id){st.theme=id;lsS(K.theme,id);document.getElementById("root").setAttribute("data-theme",id);
 const m=document.querySelector('meta[name="theme-color"]');
 if(m)m.setAttribute("content",getComputedStyle(document.body).backgroundColor);paint()}
function setLang(l){const def=st.currency==="ج.م"||st.currency==="EGP";
 st.lang=l;lsS(K.lang,l);
 if(def){st.currency=l==="ar"?"ج.م":"EGP";lsS(K.cur,st.currency)}
 const r=document.getElementById("root");r.setAttribute("lang",l);r.setAttribute("dir",l==="ar"?"rtl":"ltr");render()}
function setCur(v){st.currency=(v||"").trim()||(st.lang==="ar"?"ج.م":"EGP");lsS(K.cur,st.currency);paint()}
function toast(msg,warn){const el=document.getElementById("toast");
 el.innerHTML=(warn?I.warn:I.ok)+`<span>${esc(msg)}</span>`;
 el.className=warn?"on warn":"on";clearTimeout(el._t);el._t=setTimeout(()=>{el.className=""},3000)}

/* ============ Export ============ */
function dl(name,content,type){const b=new Blob([content],{type});const a=document.createElement("a");
 a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();
 setTimeout(()=>{try{URL.revokeObjectURL(a.href)}catch(e){}a.remove()},300)}
function expCSV(all){
 const rows=[["التاريخ","النوع","التصنيف / المصدر","المبلغ","الملاحظة"]];
 const E=all?st.data.expenses:expOf(),N=all?st.data.incomes:incOf();
 const items=[...N.map(r=>({d:txD(r),k:"دخل",n:r.source,a:r.amount,no:""})),
  ...E.map(r=>{const c=byId(r.categoryId);return{d:txD(r),k:"مصروف",n:c?cNm(c):"—",a:r.amount,no:r.note||""}})]
  .sort((a,b)=>a.d.localeCompare(b.d));
 items.forEach(i=>rows.push([i.d,i.k,i.n,i.a,i.no]));
 rows.push([]);rows.push(["إجمالي الدخل","","",sum(N),""]);rows.push(["إجمالي المصروفات","","",sum(E),""]);
 const csv=rows.map(r=>r.map(c=>{const s=String(c==null?"":c);
  return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}).join(",")).join("\r\n");
 dl(`mizan-${all?"all":st.month}.csv`,"﻿"+csv,"text/csv;charset=utf-8;");toast(t("exported"))}
function expJSON(){dl(`mizan-backup-${mKey()}.json`,JSON.stringify(st.data,null,2),"application/json")}
function impJSON(inp){const f=inp.files&&inp.files[0];if(!f)return;
 if(!confirm(t("impAsk"))){inp.value="";return}
 const r=new FileReader();
 r.onload=()=>{try{st.data=normalize(JSON.parse(r.result));persist();render();toast(t("imported"))}
  catch(e){alert(t("tBadFile"))}inp.value=""};
 r.readAsText(f)}
function resetAll(){if(!confirm(t("resetAsk")))return;
 st.data={categories:JSON.parse(JSON.stringify(DEF)),incomes:[],expenses:[],debts:[],gameyas:[],savings:[],invests:[],fixed:[]};
 persist();render();toast(t("del"))}

/* ============ Sync / Auth ============ */
const mkC=()=>Math.random().toString(36).slice(2,6).toUpperCase()+"-"+Math.random().toString(36).slice(2,6).toUpperCase();
function mkCode(){const c=mkC();const f=document.getElementById("syncF");if(f)f.value=c;startCode(c);paint();toast(t("tCode"))}
function joinCode(){const f=document.getElementById("syncF");const c=f?f.value.trim():"";if(!c)return;startCode(c);paint();toast(t("syncWait"))}
function offCode(){stopCode();paint()}
function isNative(){return !!(window.MizanNative&&window.MizanNative.isNative&&window.MizanNative.isNative())}
function gIn(){
 if(!auth){toast(t("gFail"),1);return}
 if(sync.busy)return;sync.busy=true;toast(t("gWait"));
 const quiet=()=>{const el=document.getElementById("toast");if(el)el.className="";};
 const fail=err=>{
  sync.busy=false;
  const c=(err&&err.code)||"";
  const m=(err&&err.message)||"";
  // The user backing out of the account picker is not an error worth shouting about.
  if(c==="auth/popup-closed-by-user"||c==="auth/cancelled-popup-request"||/cancel|12501/i.test(m)){quiet();return}
  if(c==="auth/popup-blocked"){toast(t("gBlocked"),1);return}
  if(c==="auth/unauthorized-domain"){toast(t("gDomain"),1);return}
  console.error(err);toast(t("gFail")+(c?" ("+c+")":""),1);
 };
 // In the Android app there is no browser window to pop up. The Capacitor plugin
 // shows Android's own account picker and hands back an ID token; the JS SDK then
 // signs in with it, so auth state lands in the same place the rest of the app reads.
 if(isNative()){
  window.MizanNative.googleIdToken()
   .then(tok=>{
    if(!tok)throw new Error("no-id-token");
    return auth.signInWithCredential(firebase.auth.GoogleAuthProvider.credential(tok));
   })
   .then(()=>{sync.busy=false})
   .catch(fail);
  return;
 }
 const p=new firebase.auth.GoogleAuthProvider();
 p.setCustomParameters({prompt:"select_account"});
 // Popup only. signInWithRedirect silently loses its result when the app is
 // served from a different origin than authDomain (Chrome storage partitioning),
 // so falling back to it would strand the user instead of signing them in.
 auth.signInWithPopup(p)
  .then(()=>{sync.busy=false})
  .catch(fail)}
function gOut(){if(!auth)return;
 if(unsub){unsub();unsub=null}
 sync.status="off";
 // Sign out of the native plugin too, or Android keeps offering the same account.
 if(isNative()&&window.MizanNative.signOut)window.MizanNative.signOut();
 auth.signOut().then(()=>{sync.user=null;render()})}

/* ============ Install ============ */
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();prompt_=e});
function doInstall(){if(!prompt_){toast(t("tInstMenu"),1);return}
 prompt_.prompt();prompt_.userChoice.finally(()=>{prompt_=null})}

/* ============ Updates ============
 * version.json on the site carries the newest release. The Android app can't update
 * itself, so it compares and offers the APK; the web build just reloads. */
const UPD_URL="https://technicalteam774.github.io/finance-dashboard/version.json";
const APK_PAGE="https://github.com/TechnicalTeam774/finance-dashboard/releases/latest";
const verNum=v=>{const p=String(v||"0").split(".");return (+p[0]||0)*1e6+(+p[1]||0)*1e3+(+p[2]||0)};
let updLast=0;
function closeModal(){const h=document.getElementById("modalHost");
 const s=h.querySelector(".sheet"),c=h.querySelector(".scrim");
 if(s)s.classList.remove("on");if(c)c.classList.remove("on");
 setTimeout(()=>{h.innerHTML=""},260)}
function modal(inner){
 const h=document.getElementById("modalHost");
 h.innerHTML=`<div class="scrim" onclick="closeModal()"></div><div class="sheet"><div class="grab"></div>${inner}</div>`;
 requestAnimationFrame(()=>{const s=h.querySelector(".sheet"),c=h.querySelector(".scrim");
  if(s)s.classList.add("on");if(c)c.classList.add("on")});
 return h}
const notesHTML=l=>l&&l.length?`<ul class="upd-notes">${l.map(n=>`<li>${esc(n)}</li>`).join("")}</ul>`:"";
function checkUpdate(manual){
 if(typeof fetch!=="function"||location.protocol==="file:"){if(manual)toast(t("upToDate"));return}
 updLast=Date.now();
 fetch(UPD_URL+"?t="+Date.now(),{cache:"no-store"}).then(r=>r.json()).then(j=>{
  if(!j||!j.version)return;
  if(verNum(j.version)>verNum(APP_VER)){
   // "Later" is respected for half a day, so the dialog isn't in the way every launch.
   if(!manual&&st.data.updLater===j.version&&Date.now()-(st.data.updLaterAt||0)<12*3600000)return;
   showUpdate(j);
  }else if(manual)toast(t("upToDate"));
 }).catch(()=>{if(manual)toast(t("netErr"),1)})}
function showUpdate(j){
 if(document.querySelector("#modalHost .sheet"))return;
 const nat=isNative();
 modal(`<div class="upd-ic">🎉</div>
  <div class="stitle" style="justify-content:center">${t("updTitle")}</div>
  <p class="note" style="text-align:center;margin-bottom:10px">${t("updVer",esc(j.version))}</p>
  ${notesHTML(j.notes)}
  <div class="frow"><button class="btn ghost" onclick="updLater('${esc(j.version)}')">${t("later")}</button>
  <button class="btn" onclick="updGo('${esc(j.apk||APK_PAGE)}')">${t(nat?"updGetApk":"updNow")}</button></div>
  ${nat?`<p class="note" style="margin-top:10px">${t("updApkHint")}</p>`:""}`)}
function updLater(v){st.data.updLater=v;st.data.updLaterAt=Date.now();save();closeModal()}
function updGo(url){closeModal();
 if(isNative())window.open(url,"_system");else location.reload(true)}
// Once per new version: what changed. Someone upgrading from a build older than
// this flag has no seenVer either, so an existing ledger counts as an upgrade.
function whatsNew(){
 if(st.data.seenVer===APP_VER)return;
 const fresh=!st.data.seenVer&&!(st.data.expenses.length||st.data.incomes.length
  ||st.data.debts.length||st.data.gameyas.length||st.data.savings.length||st.data.invests.length);
 st.data.seenVer=APP_VER;save();
 if(fresh)return;
 const n=CHANGES[APP_VER];if(!n||!n.length)return;
 modal(`<div class="upd-ic">✨</div>
  <div class="stitle" style="justify-content:center">${t("newIn",APP_VER)}</div>
  ${notesHTML(n)}
  <button class="btn" onclick="closeModal()">${t("letsGo")}</button>`)}
document.addEventListener("visibilitychange",()=>{
 if(document.visibilityState==="visible"&&Date.now()-updLast>6*3600000)checkUpdate(false)});

/* ============ Android back button ============
 * native/entry.js calls this; returning false lets the app close. */
let exitArmed=0;
window.MizanBack=function(){
 if(document.querySelector("#modalHost .sheet")){closeModal();return true}
 if(document.getElementById("sheet")){closeAdd();return true}
 if(st.tab!=="home"){go("home");return true}
 // On the dashboard it takes two presses, so a stray back never drops the app.
 const now=Date.now();
 if(now-exitArmed<2500)return false;
 exitArmed=now;toast(t("exitAsk"));return true;
};
Object.assign(window,{closeModal,updLater,updGo});

Object.assign(window,{go,shiftM,openAdd,closeAdd,setKind,moreCats,pickC,useC,kp,saveTx,editTx,setF,
 delExp,delInc,delCat,addCat,editB,addDebt,delDebt,setTheme,setLang,setCur,
 expCSV,expJSON,impJSON,resetAll,mkCode,joinCode,offCode,gIn,gOut,doInstall,ad,
 setW,seeCat,addGam,delGam,addSav,delSav,addToSav,addInv,delInv,updInv,checkUpdate,editEnt,saveEnt,bankGam,newFixed,addFixed,addFixedFrom,delFixed,logFixed});

/* ============ Boot ============ */
(function boot(){
 const r=document.getElementById("root");
 r.setAttribute("lang",st.lang);r.setAttribute("dir",st.lang==="ar"?"rtl":"ltr");
 r.setAttribute("data-theme",st.theme);
 render();
 const m=document.querySelector('meta[name="theme-color"]');
 if(m)m.setAttribute("content",getComputedStyle(document.body).backgroundColor);

 if(FB_ON&&auth){
  auth.onAuthStateChanged(u=>{
   const was=sync.user&&sync.user.uid;
   sync.user=u?{uid:u.uid,email:u.email,displayName:u.displayName,photoURL:u.photoURL}:null;
   if(unsub){unsub();unsub=null}
   if(u){attach()}
   else{const c=lsG(K.sync,"");if(c){sync.code=c;attach()}else{sync.status="off"}}
   if(was!==(u&&u.uid))render();else{badge();if(st.tab==="set")paint()}
  });
  try{auth.getRedirectResult().catch(e=>{if(e&&e.code)console.error("redirect",e.code)})}catch(e){}
 }else if(FB_ON){
  const c=lsG(K.sync,"");if(c)startCode(c);
 }

 // The Android build has no service worker: its files are already local, and the
 // cache would make every update take two launches to show up.
 if("serviceWorker" in navigator&&!isNative()){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
 }
 // What's new first; the update check waits so the two dialogs can't collide.
 setTimeout(whatsNew,600);
 setTimeout(()=>checkUpdate(false),3000);

 try{const q=new URLSearchParams(location.search);
  if(q.get("quick")==="expense")setTimeout(()=>openAdd("e"),300);
  if(q.get("quick")==="income")setTimeout(()=>openAdd("i"),300);
  if(q.get("view")==="today"){st.tab="log";render()}
  if(q.toString())history.replaceState({},"",location.pathname)}catch(e){}
})();
</script>
