function loadData(){
 try{const raw=localStorage.getItem(K.data);
  if(raw){const d=JSON.parse(raw);
   d.categories=d.categories||[];d.incomes=d.incomes||[];d.expenses=d.expenses||[];d.debts=d.debts||[];
   const RM={cat_food:"c_food",cat_transport:"c_transport",cat_housing:"c_housing",cat_health:"c_health",
    cat_investment:"c_invest",cat_subscriptions:"c_subs",cat_entertainment:"c_fun",cat_shopping:"c_shop",
    cat_education:"c_edu",cat_family:"c_family",cat_other:"c_other"};
   d.categories.forEach(c=>{if(RM[c.id])c.id=RM[c.id]});
   d.expenses.forEach(e=>{if(RM[e.categoryId])e.categoryId=RM[e.categoryId]});
   const seen=new Set();
   d.categories=d.categories.filter(c=>seen.has(c.id)?false:(seen.add(c.id),true));
   DEF_CATS.forEach(c=>{if(!seen.has(c.id))d.categories.push(JSON.parse(JSON.stringify(c)))});
   d.categories.forEach(c=>{if(!c.emoji)c.emoji="🏷️"});
   return d}
 }catch(e){}
 return {categories:JSON.parse(JSON.stringify(DEF_CATS)),incomes:[],expenses:[],debts:[]};
}

function persist(){if(!remote)st.data.updatedAt=Date.now();lsS(K.data,JSON.stringify(st.data));if(!remote)push()}

function push(){if(!db||!sync.code||remote)return;db.collection("finance_dashboards").doc(sync.code).set(st.data).catch(e=>console.error(e))}
function startSync(code){
 if(!db||!code)return;sync.code=code;lsS(K.sync,code);sync.status="connecting";badge();
 if(unsub)unsub();
 unsub=db.collection("finance_dashboards").doc(code).onSnapshot(doc=>{
  sync.status="on";
  if(doc.exists){const r=doc.data();
   if((r.updatedAt||0)>(st.data.updatedAt||0)){remote=true;
    st.data={categories:r.categories||[],incomes:r.incomes||[],expenses:r.expenses||[],debts:r.debts||[],updatedAt:r.updatedAt||0};
    lsS(K.data,JSON.stringify(st.data));remote=false;render()}
  }else push();
  badge()},e=>{console.error(e);sync.status="error";badge()})}
function stopSync(){if(unsub)unsub();unsub=null;sync.code=null;sync.status="off";lsS(K.sync,"");badge()}

function catSpend(m=st.month){const ex=expOf(m);
 return st.data.categories.map(c=>{const sp=ex.filter(e=>e.categoryId===c.id).reduce((s,e)=>s+Number(e.amount||0),0);
  return{...c,spent:sp,pct:c.budget>0?(sp/c.budget)*100:0}})}
function trend(){const ks=[];for(let i=5;i>=0;i--)ks.push(mShift(st.month,-i));
 return ks.map(k=>{const a=sum(incOf(k)),b=sum(expOf(k));return{k,label:mShort(k),income:a,expense:b,net:a-b}})}
function freqCats(){const c={};st.data.expenses.forEach(e=>{c[e.categoryId]=(c[e.categoryId]||0)+1});
 return st.data.categories.slice().sort((a,b)=>(c[b.id]||0)-(c[a.id]||0))}
function recentCombos(){const seen=new Set(),out=[];
 [...st.data.expenses].sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).forEach(e=>{
  const k=e.categoryId+"|"+e.amount;if(!seen.has(k)&&out.length<4){seen.add(k);out.push(e)}});
 return out}

function payoff(bal,rate,pay){
 bal=Number(bal)||0;rate=Number(rate)||0;pay=Number(pay)||0;
 if(bal<=0)return{n:0,interest:0,ok:true};
 if(pay<=bal*rate)return{n:Infinity,interest:Infinity,ok:false};
 if(rate===0)return{n:Math.ceil(bal/pay),interest:0,ok:true};
 const n=Math.ceil(-Math.log(1-(bal*rate)/pay)/Math.log(1+rate));
 let b=bal,ti=0;
 for(let i=0;i<n&&i<600;i++){const it=b*rate;ti+=it;b=b+it-pay;if(b<0)b=0}
 return{n,interest:ti,ok:true}}

function insights(){
 const out=[],cur=st.currency,now=new Date(),isCur=st.month===mKey();
 const exps=expOf(),incs=incOf(),totE=sum(exps),totI=sum(incs);
 const dim=daysIn(st.month),dayNo=isCur?now.getDate():dim;
 const cs=catSpend(),bt=cs.reduce((s,c)=>s+(Number(c.budget)||0),0),plan=bt>0?bt:totI;

 if(isCur){
  const td=dKey(now),ts=exps.filter(e=>txDate(e)===td).reduce((s,e)=>s+Number(e.amount||0),0);
  const past=exps.filter(e=>txDate(e)<td),ds=new Set(past.map(txDate));
  const avg=ds.size?past.reduce((s,e)=>s+Number(e.amount||0),0)/ds.size:0;
  if(ts>0&&avg>0){const d=((ts-avg)/avg)*100;
   if(d>=50)out.push({lv:"danger",ic:"🔥",t:`صرفت النهاردة ${fmt(ts)} ${cur}`,
    b:`ده أعلى من متوسطك اليومي (${fmt(avg)}) بـ ${Math.round(d)}٪. لو اليوم ده اتكرر، الشهر هيتقفل بعجز.`});
   else if(d<=-40)out.push({lv:"good",ic:"👏",t:`يوم موفّر — ${fmt(ts)} ${cur} بس`,
    b:`أقل من متوسطك اليومي بـ ${Math.round(-d)}٪. كمّل كده.`});
   else out.push({lv:"info",ic:"📅",t:`صرفت النهاردة ${fmt(ts)} ${cur}`,b:`متوسطك اليومي ${fmt(avg)} — إنت في المعدل الطبيعي.`});
  }else if(ts===0&&dayNo>1)out.push({lv:"good",ic:"✨",t:"النهاردة لسه من غير مصاريف",b:"كل يوم من غير صرف بيقرّبك من هدفك."});
 }
 if(plan>0&&dayNo>2&&totE>0){const proj=(totE/dayNo)*dim;
  if(proj>plan*1.1)out.push({lv:"danger",ic:"📈",t:`بالمعدل ده هتنهي الشهر بـ ${fmt(proj)} ${cur}`,
   b:`ده أعلى من خطتك (${fmt(plan)}) بـ ${fmt(proj-plan)}. محتاج تقلّل حوالي ${fmt((proj-plan)/Math.max(1,dim-dayNo))} في اليوم.`});
  else if(proj<plan*.85)out.push({lv:"good",ic:"🎯",t:"ماشي أحسن من الخطة",
   b:`المتوقع تنهي الشهر بـ ${fmt(proj)} بدل ${fmt(plan)} — يعني توفير ${fmt(plan-proj)}.`});
 }
 if(plan>0&&isCur&&dayNo<dim){const left=plan-totE,pd=left/(dim-dayNo+1);
  if(left>0)out.push({lv:"info",ic:"🧮",t:`متاح ليك ${fmt(pd)} ${cur} في اليوم`,b:`فاضل ${fmt(left)} على ${dim-dayNo+1} يوم لحد آخر الشهر.`});
  else out.push({lv:"danger",ic:"⛔",t:"خلّصت ميزانية الشهر",
   b:`تجاوزت بـ ${fmt(-left)} ${cur} وفاضل ${dim-dayNo+1} يوم. أي صرف زيادة هيطلع من مدخراتك.`});
 }
 const over=cs.filter(c=>c.budget>0&&c.spent>c.budget).sort((a,b)=>(b.spent-b.budget)-(a.spent-a.budget));
 const near=cs.filter(c=>c.budget>0&&c.spent<=c.budget&&c.pct>=80);
 if(over.length)out.push({lv:"danger",ic:"⚠️",t:`تجاوزت الميزانية في ${plAr(over.length,"تصنيف","تصنيفين","تصنيفات")}`,
  b:over.slice(0,3).map(c=>`${c.emoji} ${cName(c)}: ${fmt(c.spent)} من ${fmt(c.budget)}`).join(" · ")});
 if(near.length)out.push({lv:"warn",ic:"🔔",t:`قربت تخلّص ميزانية ${plAr(near.length,"تصنيف","تصنيفين","تصنيفات")}`,
  b:near.slice(0,3).map(c=>`${c.emoji} ${cName(c)}: ${Math.round(c.pct)}٪`).join(" · ")});
 const top=cs.filter(c=>c.spent>0).sort((a,b)=>b.spent-a.spent)[0];
 if(top&&totE>0){const sh=Math.round((top.spent/totE)*100);
  out.push({lv:sh>45?"warn":"info",ic:top.emoji,t:`أكتر بند: ${cName(top)} — ${fmt(top.spent)} ${cur}`,
   b:`بياخد ${sh}٪ من مصاريف الشهر.${sh>45?" نسبة عالية — لو عايز توفر، ابدأ من هنا.":""}`})}
 const big=[...exps].sort((a,b)=>b.amount-a.amount)[0];
 if(big&&totE>0&&big.amount>totE*0.25){const c=catById(big.categoryId);
  out.push({lv:"info",ic:"💸",t:`أكبر عملية: ${fmt(big.amount)} ${cur}`,
   b:`${c?c.emoji+" "+cName(c):""}${big.note?" — "+big.note:""} · لوحدها ${Math.round(big.amount/totE*100)}٪ من الشهر.`})}
 const pm=mShift(st.month,-1),pe=sum(expOf(pm));
 if(pe>0&&totE>0){const d=((totE-pe)/pe)*100;
  if(Math.abs(d)>=12)out.push({lv:d>0?"warn":"good",ic:d>0?"⬆️":"⬇️",
   t:`مصاريفك ${d>0?"أعلى":"أقل"} من ${mLabel(pm)} بـ ${Math.abs(Math.round(d))}٪`,b:`${fmt(totE)} مقابل ${fmt(pe)} ${cur}.`})}
 const pcs=catSpend(pm),drop=pcs.filter(p=>p.spent>0&&!cs.find(c=>c.id===p.id&&c.spent>0));
 if(drop.length)out.push({lv:"good",ic:"🚫",t:`ما صرفتش في ${plAr(drop.length,"بند","بندين","بنود")} الشهر ده`,
  b:drop.slice(0,4).map(c=>`${c.emoji} ${cName(c)} (كان ${fmt(c.spent)})`).join(" · ")});
 if(totI>0){const r=((totI-totE)/totI)*100;
  if(r<0)out.push({lv:"danger",ic:"🩸",t:"بتصرف أكتر من دخلك",b:`العجز ${fmt(totE-totI)} ${cur} الشهر ده. ده بيتغطى من مدخرات أو ديون.`});
  else if(r>=25)out.push({lv:"good",ic:"🏆",t:`بتوفّر ${Math.round(r)}٪ من دخلك`,b:`${fmt(totI-totE)} ${cur} فايض. نسبة ممتازة — حافظ عليها.`});
  else if(r<10)out.push({lv:"warn",ic:"📉",t:`نسبة ادخارك ${Math.round(r)}٪ بس`,b:`فايض ${fmt(totI-totE)} ${cur}. حاول توصلها 20٪ على الأقل.`})}
 const ds2=st.data.debts||[];
 if(ds2.length){const tb=ds2.reduce((s,d)=>s+Number(d.balance||0),0);
  const w=ds2.map(d=>({...d,r:payoff(d.balance,(Number(d.rate)||0)/100,d.monthlyPay)}))
   .sort((a,b)=>(Number(b.rate)||0)-(Number(a.rate)||0))[0];
  if(w&&!w.r.ok)out.push({lv:"danger",ic:"🆘",t:`"${w.name}" رصيده بيزيد مش بينقص`,
   b:"الدفعة الشهرية أقل من الفايدة. لازم تزوّدها فوراً وإلا الدين هيكبر للأبد."});
  else if(w&&isFinite(w.r.n)&&w.r.n>0)out.push({lv:"info",ic:"💳",t:`إجمالي ديونك ${fmt(tb)} ${cur}`,
   b:`أغلاهم "${w.name}" — هيخلص بعد ${w.r.n} شهر وهيكلفك ${fmt(w.r.interest)} فوايد. ابدأ بيه.`})}
 const ord={danger:0,warn:1,good:2,info:3};
 return out.sort((a,b)=>ord[a.lv]-ord[b.lv]);
}

function donut(items,w=240,h=240){
 const tot=items.reduce((s,d)=>s+d.value,0);if(!tot)return"";
 const cx=w/2,cy=h/2,R=92,r=56;let a=-90,o="";
 items.forEach(d=>{const sw=(d.value/tot)*360,big=sw>180?1:0;
  const s=a*Math.PI/180,e=(a+sw)*Math.PI/180;
  const x1=cx+R*Math.cos(s),y1=cy+R*Math.sin(s),x2=cx+R*Math.cos(e),y2=cy+R*Math.sin(e);
  const i1=cx+r*Math.cos(s),j1=cy+r*Math.sin(s),i2=cx+r*Math.cos(e),j2=cy+r*Math.sin(e);
  o+=`<path d="M${x1},${y1} A${R},${R} 0 ${big} 1 ${x2},${y2} L${i2},${j2} A${r},${r} 0 ${big} 0 ${i1},${j1} Z" fill="${d.color}" stroke="var(--pa)" stroke-width="2.5"/>`;
  a+=sw});
 return `<svg class="ch2" viewBox="0 0 ${w} ${h}" style="max-width:240px;margin:0 auto">${o}
 <text x="${cx}" y="${cy+6}" text-anchor="middle" fill="var(--text)" font-size="19" font-weight="700" font-family="JetBrains Mono">${fmt(tot)}</text></svg>`}
function bars(d,w=560,h=220){
 const p={l:40,r:10,t:12,b:24},iw=w-p.l-p.r,ih=h-p.t-p.b;
 const mx=Math.max(1,...d.map(x=>Math.max(x.income,x.expense)));
 const gw=iw/d.length,bw=gw*.3;let o="";
 d.forEach((x,i)=>{const gx=p.l+i*gw+gw*.16,hi=(x.income/mx)*ih,he=(x.expense/mx)*ih;
  o+=`<rect x="${gx}" y="${p.t+ih-hi}" width="${bw}" height="${hi}" rx="4" fill="var(--green)"/>`;
  o+=`<rect x="${gx+bw+4}" y="${p.t+ih-he}" width="${bw}" height="${he}" rx="4" fill="var(--red)"/>`});
 const g=[0,.5,1].map(f=>`<line x1="${p.l}" y1="${p.t+ih*(1-f)}" x2="${w-p.r}" y2="${p.t+ih*(1-f)}" stroke="var(--line)" stroke-dasharray="3,4"/>`).join("");
 const l=d.map((x,i)=>`<text x="${p.l+i*gw+gw/2}" y="${h-5}" fill="var(--sub)" font-size="11" text-anchor="middle" font-family="IBM Plex Sans Arabic">${x.label}</text>`).join("");
 return `<svg class="ch2" viewBox="0 0 ${w} ${h}">${g}${o}${l}</svg>`}

    :`<div class="t">${t("neverPayoff")}</div><div class="b">لازم تزوّد الدفعة الشهرية فوراً.</div>`}</div></div></div>`}).join("")
  :`<div class="empty">${I.spark}<div>${t("noDebts")}<br><span style="font-size:11.5px">${t("addDebtHint")}</span></div></div>`}</div>
 <div class="card"><div class="ch">${I.plus}${t("addDebt")}</div>
  <div class="fld"><label class="fl">${t("debtName")}</label><input id="dN" placeholder="كريدت كارد، قرض…"></div>
  <div class="frow"><div class="fld"><label class="fl">${t("balance")}</label><input id="dB" type="number" inputmode="decimal" placeholder="0"></div>
  <div class="fld"><label class="fl">${t("rate")}</label><input id="dR" type="number" inputmode="decimal" placeholder="2.5" step="any"></div></div>
  <div class="fld"><label class="fl">${t("monthlyPay")}</label><input id="dP" type="number" inputmode="decimal" placeholder="0"></div>
  <button class="btn" onclick="addDebt()">${I.plus}${t("save")}</button></div></div>`}

function vSet(){
 const on=sync.status==="on",u=sync.user;
 const inst=(()=>{try{return(window.matchMedia&&window.matchMedia("(display-mode: standalone)").matches)||window.navigator.standalone===true}catch(e){return false}})();
 return `<div class="sec">
 <div class="card"><div class="ch">${I.phone}${t("install")}</div>
  ${inst?`<div class="sl">${I.check}<span>${t("installed")}</span></div>`
   :`<p class="note" style="margin-bottom:12px">${t("installHint")}</p>
     <button class="btn" onclick="doInstall()">${I.dl}${t("install")}</button>
     <p class="note" style="margin-top:10px">لو الزرار مشتغلش: من قايمة المتصفح اختار «تثبيت التطبيق» أو «Add to Home screen».</p>`}</div>
 <div class="card"><div class="ch">${I.palette}${t("theme")}</div>
  <div class="tgrid">${THEMES.map(h=>`<button class="tchip${st.theme===h.id?" on":""}" onclick="setTheme('${h.id}')">
   <span class="swatch">${h.sw.map(c=>`<i style="background:${c}"></i>`).join("")}</span>
   <span class="tn">${st.lang==="ar"?h.ar:h.en}</span></button>`).join("")}</div></div>
 <div class="card"><div class="ch">${I.globe}${t("language")}</div>
  <div class="seg"><button class="${st.lang==="ar"?"on":""}" onclick="setLang('ar')">العربية</button>
  <button class="${st.lang==="en"?"on":""}" onclick="setLang('en')">English</button></div>
  <div class="fld" style="margin-top:13px"><label class="fl">${t("currency")}</label>
  <input id="curI" value="${esc(st.currency)}" onchange="setCur(this.value)"></div></div>
 <div class="card"><div class="ch">${I.cloud}${t("sync")}</div>
  <div class="sl">${on?I.link:I.unlink}<span>${on?t("syncOn"):sync.status==="connecting"?t("syncWait"):sync.status==="error"?t("syncErr"):t("syncOff")}</span></div>
  ${u?`<div class="sl">${I.check}<span>${t("googleAs")} ${esc(u.email||u.displayName||"")}</span></div>
     <button class="btn ghost" onclick="gOut()">${t("googleOut")}</button>`
   :`<button class="btn ghost" onclick="gIn()">${I.cloud}${t("googleIn")}</button>`}
  <div style="height:11px"></div><p class="note" style="margin-bottom:10px">${t("syncDesc")}</p>
  <input id="syncF" placeholder="${t("codePh")}" value="${esc(sync.code||lsG(K.sync,""))}"><div style="height:9px"></div>
  <div class="frow"><button class="btn" onclick="mkCode()">${t("genCode")}</button>
  <button class="btn ghost" onclick="joinCode()">${t("joinCode")}</button></div>
  ${sync.code?`<div style="height:9px"></div><button class="btn danger" onclick="offSync()">${t("disconnect")}</button>`:""}</div>
 <div class="card"><div class="ch">${I.tag}${t("categories")}</div>
  ${st.data.categories.map(c=>`<div class="row" style="--tone:${c.color}"><div class="rico">${c.emoji}</div>
   <div class="rmain"><div class="rt">${esc(cName(c))}</div></div>
   <button class="ib" style="width:auto;padding:0 11px;font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--accent)" onclick="editBudget('${c.id}',${c.budget})">${fmt(c.budget)}</button>
   <button class="ib" onclick="delCat('${c.id}')">${I.del}</button></div>`).join("")}
  <div style="height:12px"></div>
  <div class="frow"><div class="fld"><input id="ncN" placeholder="${t("catName")}"></div>
  <div class="fld" style="max-width:120px"><input id="ncB" type="number" inputmode="decimal" placeholder="${t("budget")}"></div></div>
  <div class="fld"><select id="ncE">${EMO.map(e=>`<option value="${e}">${e}</option>`).join("")}</select></div>
  <button class="btn ghost" onclick="addCat()">${I.plus}${t("addCat")}</button></div>
 <div class="card"><div class="ch">${I.dl}${t("data")}</div>
  <button class="btn ghost" onclick="exportCSV()">${I.dl}${t("exportCsv")}</button><div style="height:9px"></div>
  <button class="btn ghost" onclick="exportJSON()">${I.dl}${t("exportJson")}</button><div style="height:9px"></div>
  <button class="btn ghost" onclick="document.getElementById('impF').click()">${I.ul}${t("importJson")}</button>
  <input type="file" id="impF" accept="application/json" style="display:none" onchange="importJSON(this)"><div style="height:9px"></div>
  <button class="btn danger" onclick="resetAll()">${I.del}${t("reset")}</button></div></div>`}

const add={open:false,kind:"e",amount:"",cat:null,note:"",date:null,source:""};
function openAdd(kind){add.open=true;add.kind=kind||"e";add.amount="";add.note="";add.source="";
 add.date=dKey();const f=freqCats();add.cat=f[0]?f[0].id:null;drawSheet()}
function closeAdd(){const sc=document.getElementById("scrim"),sh=document.getElementById("sheet");
 if(sc)sc.classList.remove("on");if(sh)sh.classList.remove("on");
 setTimeout(()=>{document.getElementById("sheetHost").innerHTML="";add.open=false},230)}
function drawSheet(){
 const cats=freqCats(),cur=esc(st.currency),rec=recentCombos(),amt=add.amount||"0";
 document.getElementById("sheetHost").innerHTML=`
 <div class="scrim" id="scrim" onclick="closeAdd()"></div>
 <div class="sheet" id="sheet"><div class="grab"></div>
  <div class="sh-title"><span>${add.kind==="e"?t("addExp"):t("addInc")}</span>
   <button class="xbtn" onclick="closeAdd()">${I.x}</button></div>
  <div class="seg ${add.kind==="e"?"exp":"inc"}">
   <button class="${add.kind==="e"?"on":""}" onclick="setKind('e')">${t("expense")}</button>
   <button class="${add.kind==="i"?"on":""}" onclick="setKind('i')">${t("income")}</button></div>
  <div class="amt"><div class="v" style="color:${add.kind==="e"?"var(--red)":"var(--green)"}">${esc(amt)}</div><div class="c">${cur}</div></div>
  ${add.kind==="e"&&rec.length&&!add.amount?`<div class="chips">${rec.map(r=>{const c=catById(r.categoryId);
   return c?`<button class="chip quick" onclick="useCombo('${r.categoryId}',${r.amount})"><span class="e">${c.emoji}</span><b>${fmt(r.amount)}</b></button>`:""}).join("")}</div>`:""}
  ${add.kind==="e"?`<div class="chips">${cats.map(c=>`<button class="chip${add.cat===c.id?" on":""}" onclick="pickCat('${c.id}')">
   <span class="e">${c.emoji}</span>${esc(cName(c))}</button>`).join("")}</div>`
   :`<div class="fld"><input id="srcI" placeholder="${t("sourcePh")}" value="${esc(add.source)}" oninput="add.source=this.value"></div>`}
  <div class="kp">${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="key" onclick="kp('${n}')">${n}</button>`).join("")}
   <button class="key" onclick="kp('00')">00</button><button class="key" onclick="kp('0')">0</button>
   <button class="key" onclick="kp('del')">${I.back}</button></div>
  <div class="fld"><input id="noteI" placeholder="${t("note")} (${t("optional")})" value="${esc(add.note)}" oninput="add.note=this.value"></div>
  <div class="fld"><label class="fl">${t("date")}</label><input id="dateI" type="date" value="${add.date}" onchange="add.date=this.value"></div>
  <button class="btn" onclick="saveTx()">${I.check}${t("save")}</button></div>`;
 requestAnimationFrame(()=>{const s=document.getElementById("scrim"),h=document.getElementById("sheet");
  if(s)s.classList.add("on");if(h)h.classList.add("on")})}
function setKind(k){add.kind=k;drawSheet()}
function pickCat(id){add.cat=id;drawSheet()}
function useCombo(c,a){add.cat=c;add.amount=String(a);drawSheet()}
function kp(v){
 if(v==="del")add.amount=add.amount.slice(0,-1);
 else{if(add.amount.length>9)return;add.amount=(add.amount==="0"?"":add.amount)+v}
 const el=document.querySelector(".amt .v");if(el)el.textContent=add.amount||"0";
 if(add.amount.length<=1)drawSheet()}
function saveTx(){
 const amount=Number(add.amount);
 if(!(amount>0)){toast(t("enterAmount"),1);return}
 const date=add.date||dKey(),month=date.slice(0,7);
 if(add.kind==="i"){
  const src=(add.source||"").trim()||t("income");
  st.data.incomes.push({id:uid("inc"),month,date,source:src,amount,createdAt:Date.now()});
  save();toast(t("savedInc"));
 }else{
  if(!add.cat){toast(t("pickCatFirst"),1);return}
  st.data.expenses.push({id:uid("exp"),month,date,categoryId:add.cat,amount,note:(add.note||"").trim(),createdAt:Date.now()});
  save();const c=catById(add.cat);
  const sp=st.data.expenses.filter(e=>e.month===month&&e.categoryId===add.cat).reduce((s,e)=>s+Number(e.amount||0),0);
  if(c&&c.budget>0&&sp>c.budget)toast(t("overBudget",cName(c)),1);else toast(t("savedTx"))}
 closeAdd();if(month!==st.month)st.month=month;
 setTimeout(()=>render(),240)}

function delExp(id){st.data.expenses=st.data.expenses.filter(r=>r.id!==id);save();paint();toast(t("deleted"))}
function delInc(id){st.data.incomes=st.data.incomes.filter(r=>r.id!==id);save();paint();toast(t("deleted"))}
function delCat(id){st.data.categories=st.data.categories.filter(c=>c.id!==id);
 st.data.expenses=st.data.expenses.filter(e=>e.categoryId!==id);save();paint()}
function addCat(){const n=document.getElementById("ncN").value.trim();if(!n)return;
 const b=Number(document.getElementById("ncB").value)||0,e=document.getElementById("ncE").value||"🏷️";
 st.data.categories.push({id:uid("cat"),name:n,budget:b,emoji:e,color:PAL[st.data.categories.length%PAL.length]});
 save();paint();toast(t("catAdded"))}
function editBudget(id,c0){const v=prompt(t("budget"),c0);if(v===null)return;
 const n=Number(v);if(isNaN(n)||n<0)return;const c=catById(id);if(c){c.budget=n;save();paint()}}
function addDebt(){const n=document.getElementById("dN").value.trim();if(!n)return;
 st.data.debts.push({id:uid("debt"),name:n,balance:Number(document.getElementById("dB").value)||0,
  rate:Number(document.getElementById("dR").value)||0,monthlyPay:Number(document.getElementById("dP").value)||0,createdAt:Date.now()});
 save();paint();toast(t("savedTx"))}
function delDebt(id){st.data.debts=st.data.debts.filter(d=>d.id!==id);save();paint()}
function setTheme(id){st.theme=id;lsS(K.theme,id);document.getElementById("root").setAttribute("data-theme",id);
 const m=document.querySelector('meta[name="theme-color"]');
 if(m)m.setAttribute("content",getComputedStyle(document.body).backgroundColor);paint()}
function setLang(l){const def=st.currency==="ج.م"||st.currency==="EGP";
 st.lang=l;lsS(K.lang,l);
 if(def){st.currency=l==="ar"?"ج.م":"EGP";lsS(K.cur,st.currency)}
 const r=document.getElementById("root");r.setAttribute("lang",l);r.setAttribute("dir",l==="ar"?"rtl":"ltr");render()}
function setCur(v){st.currency=(v||"").trim()||(st.lang==="ar"?"ج.م":"EGP");lsS(K.cur,st.currency);paint()}
function toast(msg,warn){const el=document.getElementById("toast");
 el.innerHTML=(warn?I.alert:I.check)+`<span>${esc(msg)}</span>`;
 el.className=warn?"on warn":"on";clearTimeout(el._t);el._t=setTimeout(()=>{el.className=""},3000)}

function dl(name,content,type){const b=new Blob([content],{type});const a=document.createElement("a");
 a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();
 setTimeout(()=>{try{URL.revokeObjectURL(a.href)}catch(e){}a.remove()},300)}
function exportCSV(all){
 const rows=[["التاريخ","النوع","التصنيف / المصدر","المبلغ","الملاحظة"]];
 const E=all?st.data.expenses:expOf(),N=all?st.data.incomes:incOf();
 const items=[...N.map(r=>({d:txDate(r),k:"دخل",n:r.source,a:r.amount,no:""})),
  ...E.map(r=>{const c=catById(r.categoryId);return{d:txDate(r),k:"مصروف",n:c?cName(c):"—",a:r.amount,no:r.note||""}})]
  .sort((a,b)=>a.d.localeCompare(b.d));
 items.forEach(i=>rows.push([i.d,i.k,i.n,i.a,i.no]));
 rows.push([]);rows.push(["إجمالي الدخل","","",sum(N),""]);rows.push(["إجمالي المصروفات","","",sum(E),""]);
 const csv=rows.map(r=>r.map(c=>{const s=String(c==null?"":c);
  return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}).join(",")).join("\r\n");
 dl(`mizan-${all?"all":st.month}.csv`,"\uFEFF"+csv,"text/csv;charset=utf-8;");toast("اتصدّر ✓")}
function exportJSON(){dl(`mizan-backup-${mKey()}.json`,JSON.stringify(st.data,null,2),"application/json")}
function importJSON(inp){const f=inp.files&&inp.files[0];if(!f)return;
 if(!confirm(t("importAsk"))){inp.value="";return}
 const r=new FileReader();
 r.onload=()=>{try{const d=JSON.parse(r.result);
  st.data={categories:d.categories||[],incomes:d.incomes||[],expenses:d.expenses||[],debts:d.debts||[]};
  st.data.categories.forEach(c=>{if(!c.emoji)c.emoji="🏷️"});
  persist();render();toast("تم الاستيراد ✓")}catch(e){alert("ملف غير صالح")}inp.value=""};
 r.readAsText(f)}
function resetAll(){if(!confirm(t("resetAsk")))return;
 st.data={categories:JSON.parse(JSON.stringify(DEF_CATS)),incomes:[],expenses:[],debts:[]};
 persist();render();toast("اتمسح")}

const mkC=()=>Math.random().toString(36).slice(2,6).toUpperCase()+"-"+Math.random().toString(36).slice(2,6).toUpperCase();
function mkCode(){const c=mkC();document.getElementById("syncF").value=c;startSync(c);paint();toast("الكود اتعمل ✓")}
function joinCode(){const c=document.getElementById("syncF").value.trim();if(!c)return;startSync(c);paint();toast("بيوصّل…")}
function offSync(){stopSync();paint();toast("اتفصل")}
function gIn(){if(!auth){toast("المزامنة مش متاحة",1);return}
 const p=new firebase.auth.GoogleAuthProvider();
 auth.signInWithPopup(p).catch(()=>{try{auth.signInWithRedirect(p)}catch(e){}})}
function gOut(){if(auth)auth.signOut()}

window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e});
function doInstall(){if(!deferredPrompt){toast("من قايمة المتصفح اختار «تثبيت التطبيق»",1);return}
 deferredPrompt.prompt();deferredPrompt.userChoice.finally(()=>{deferredPrompt=null})}

Object.assign(window,{go,shiftM,openAdd,closeAdd,setKind,pickCat,useCombo,kp,saveTx,setFilter,
 delExp,delInc,delCat,addCat,editBudget,addDebt,delDebt,setTheme,setLang,setCur,
 exportCSV,exportJSON,importJSON,resetAll,mkCode,joinCode,offSync,gIn,gOut,doInstall,add});

(function boot(){
 const r=document.getElementById("root");
 r.setAttribute("lang",st.lang);r.setAttribute("dir",st.lang==="ar"?"rtl":"ltr");
 r.setAttribute("data-theme",st.theme);
 render();
 const m=document.querySelector('meta[name="theme-color"]');
 if(m)m.setAttribute("content",getComputedStyle(document.body).backgroundColor);
 if(FB_ON){const c=lsG(K.sync,"");if(c)startSync(c);
  if(auth){auth.onAuthStateChanged(u=>{sync.user=u||null;
    if(u){const key="uid-"+u.uid;if(sync.code!==key)startSync(key)}
    if(st.tab==="set")paint()});
   try{auth.getRedirectResult().catch(()=>{})}catch(e){}}}
 if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
 try{const q=new URLSearchParams(location.search);
  if(q.get("quick")==="expense")setTimeout(()=>openAdd("e"),280);
  if(q.get("quick")==="income")setTimeout(()=>openAdd("i"),280);
  if(q.get("view")==="today"){st.tab="log";render()}
  if(q.toString())history.replaceState({},"",location.pathname)}catch(e){}
})();
</script>
</body>
